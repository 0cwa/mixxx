# F001: Manually dispatched Linux AddressSanitizer diagnostic for the exact
# 24 GTests encoded in the verifier below. The run is bound to the reviewed
# source commit and records the selected list, XML results, raw streams, and
# native exit receipt.
# This focused cloud run supplements the host allocation, lock, affinity, and
# calibration gates; it does not close those independent checks.
#
# Detect_leaks=0 because mixxx-test has process-lifetime singletons; ASan
# memory errors still stop the run and are also checked in the saved log.

name: F001 Cloud Native ASan
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asan:
    name: Linux ASan + F001 tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      CC: clang
      CXX: clang++
      # Address sanitizer runtime options.
      # detect_leaks=0:   we are hunting heap overflows, not leaks; mixxx-test
      #                   has many process-lifetime singletons that would
      #                   otherwise drown the signal.
      # halt_on_error=1:  fail fast on first overflow.
      # abort_on_error=1: produce a coredump-style backtrace via SIGABRT.
      # strict_string_checks=1: catch off-by-one in string ops too.
      ASAN_OPTIONS: "detect_leaks=0:halt_on_error=1:abort_on_error=1:strict_string_checks=1:print_summary=1"
      # Instrument the vendored Bungee target and its Mixxx test binary.
      CFLAGS: "-fsanitize=address -fno-omit-frame-pointer"
      CXXFLAGS: "-fsanitize=address -fno-omit-frame-pointer"
      # Retain an explicit sanitizer link flag for the static vendor target.
      LDFLAGS: "-fsanitize=address"
      # ASAN_OPTIONS already disables leak detection. Keep exitcode=0 as a
      # belt-and-suspenders guard so leak noise cannot mask heap-overflow
      # regressions if LSan is re-enabled later.
      LSAN_OPTIONS: "exitcode=0"

    steps:
      - name: "Check out repository"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # `git describe` (used by version stamping) needs full history.
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: "Bind the run to the reviewed F001 source"
        env:
          EXPECTED_SOURCE_COMMIT: 270ad9a0c1c9f86e01c280ecc1e8d13889181811
          EXPECTED_SOURCE_TREE: 1acca5ed8f221c8ffb7cea670f82e723ded53b1b
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE_COMMIT"
          test "$(git rev-parse "${EXPECTED_SOURCE_COMMIT}^{tree}")" = "$EXPECTED_SOURCE_TREE"
          changed_paths="$(git diff --name-only "$EXPECTED_SOURCE_COMMIT" "$GITHUB_SHA")"
          test "$changed_paths" = ".github/workflows/bungee-asan.yml"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          expected = os.environ["EXPECTED_SOURCE_COMMIT"]
          head = os.environ["GITHUB_SHA"]
          record = {
              "source_commit": expected,
              "source_tree": os.environ["EXPECTED_SOURCE_TREE"],
              "workflow_commit": head,
              "workflow_tree": subprocess.check_output(
                  ["git", "rev-parse", "HEAD^{tree}"], text=True
              ).strip(),
              "workflow_blob": subprocess.check_output(
                  ["git", "rev-parse", "HEAD:.github/workflows/bungee-asan.yml"], text=True
              ).strip(),
              "changed_paths_from_source": [
                  line for line in subprocess.check_output(
                      ["git", "diff", "--name-only", expected, head], text=True
                  ).splitlines() if line
              ],
              "binding": "pass",
          }
          Path("f001-source-binding.json").write_text(
              json.dumps(record, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(record, indent=2))
          PY

      - name: "Ensure that all tags are fetched"
        run: git fetch origin --force --tags

      - name: "Set up gcc/clang problem matcher"
        uses: ammaraskar/gcc-problem-matcher@0f9c86f9e693db67dacf53986e1674de5f2e5f28 # 0.3.0

      - name: "Set up build environment (apt deps)"
        run: tools/debian_buildenv.sh setup
        env:
          BUILDENV_BASEPATH: /home/runner/buildenv

      - name: "Install clang + ASan runtime"
        run: |
          sudo apt-get install -y --no-install-recommends clang lld llvm
          clang --version

      - name: "Set up ccache"
        id: ccache_restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5 read-only restore
        with:
          path: /home/runner/.cache/ccache
          key: f001-ubuntu-24.04-clang-18-qt-6.4-debug-asan-bungee-on-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            f001-ubuntu-24.04-clang-18-qt-6.4-debug-asan-bungee-on-${{ github.ref }}-
            f001-ubuntu-24.04-clang-18-qt-6.4-debug-asan-bungee-on-

      - name: "Configure ccache"
        run: |
          sudo apt-get install -y --no-install-recommends ccache
          ccache --zero-stats
          ccache --max-size=2G

      - name: "Create build directory"
        run: mkdir build

      # Retain the successful Linux ASan recipe while keeping the build
      # focused on mixxx-test. BUILD_BENCH is OFF so libpfm is not required.
      - name: "Configure (CMake, ASan)"
        working-directory: build
        run: >-
          cmake -S .. -B .
          -DCMAKE_BUILD_TYPE=Debug
          -DBUNGEE=ON
          -DSANITIZE_ADDRESS=ON
          -DBUILD_TESTING=ON
          -DBUILD_BENCH=OFF
          -DDEBUG_ASSERTIONS_FATAL=OFF
          -DWARNINGS_FATAL=OFF
          -DBATTERY=OFF
          -DBROADCAST=OFF
          -DKEYFINDER=OFF
          -DLILV=OFF
          -DOPUS=OFF
          -DQTKEYCHAIN=OFF
          -DVINYLCONTROL=ON
          -DHID=OFF
          -DBULK=OFF
          -DLOCALECOMPARE=OFF
          -DMAD=OFF
          -DMODPLUG=OFF
          -DWAVPACK=OFF
          -DFFMPEG=OFF
          -DDOWNLOAD_MANUAL=OFF
          -DINSTALL_USER_UDEV_RULES=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: "Build mixxx-test"
        id: build_mixxx_test
        working-directory: build
        run: cmake --build . --target mixxx-test -j"$(nproc)"

      - name: "Save ccache after successful build"
        id: ccache_save
        if: ${{ success() && steps.build_mixxx_test.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /home/runner/.cache/ccache
          key: ${{ steps.ccache_restore.outputs.cache-primary-key }}

      - name: "Print ccache stats"
        working-directory: build
        run: ccache --show-stats | tee ccache-stats.txt

      # Run the exact F001 selector set once and persist both native streams and
      # its exit receipt before validating XML, even when the process aborts.
      - name: "Run exact F001 selectors under ASan"
        working-directory: build
        env:
          GTEST_COLOR: "1"
        run: |
          set -euo pipefail
          cat > verify_f001_asan_tests.py <<'PY'
          #!/usr/bin/env python3
          """Verify the exact F001 GTest selector list and one ASan XML result."""

          import collections
          import hashlib
          import json
          import re
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          F001_SELECTOR_IDS = [
              "CachingReaderStatusQueueTest.ProcessLeavesUpdatesBeyondCallbackBudgetQueued",
              "CachingReaderStatusQueueTest.ReadDoesNotResetCallbackBudget",
              "CachingReaderStatusQueueTest.ProcessDiscardsChunkResultWhileTrackIsUnloading",
              "CachingReaderStatusQueueTest.TeardownDrainReclaimsQueuedChunksWithoutStateTransitions",
              "CachingReaderStatusQueueTest.ProcessRecyclesChunkIntoFixedFreePool",
              "CachingReaderStatusQueueTest.RecyclesChunksAcrossFreePoolWraparound",
              "CachingReaderWorkerTest.LateNotificationSamplesFinalScalarAndRemoval",
              "CachingReaderWorkerTest.ActiveScalarWriterRearmsDirtyObservation",
              "CachingReaderWorkerTest.CompletedWriterInvalidatesObservationWithoutLosingDirty",
              "CachingReaderWorkerTest.ScalarCertificateExhaustionFailsClosed",
              "CachingReaderWorkerTest.LateNotificationUsesCurrentOwnerDistinctSentinel",
              "CachingReaderWorkerTest.LateNotificationAcrossActualLoadReloadFailureAndUnload",
              "CachingReaderWorkerTest.ReaderFinalDrainSurvivesDatabaseEvictionReload",
              "CachingReaderWorkerTest.FinalScalarDrainsAfterStatusBackpressure",
              "CachingReaderWorkerTest.IdleUpdateObservedBeforeShutdown",
              "CachingReaderWorkerTest.PendingScalarDrainsOnShutdown",
              "CachingReaderWorkerTest.ShutdownPublicationFailureSuppressesLoadFailureSignal",
              "CachingReaderWorkerTest.ShutdownReclaimsStatusChunkWhenStatusQueueIsFull",
              "LoopCueApplyTraceForTest.CapacityOverflowIsBoundedAndSticky",
              "F001ProbeForTest.OverflowIsBoundedAndSticky",
              "F001ProbeAlignmentTest.RemovalUsesAttachedTrackBound",
              "F001ProbeAlignmentTest.ResizeQueuesOwnerThreadRefresh",
              "F001ProbeAlignmentTest.EjectWaitsForAttachedTrackRefresh",
              "F001ProbeAlignmentTest.ReplacementSeparatesTrackBounds",
          ]
          EXPECTED_FILTER = ":".join(F001_SELECTOR_IDS)
          ASAN_ERROR = re.compile(
              r"ERROR:\s*(?:AddressSanitizer|LeakSanitizer)\b"
              r"|AddressSanitizer:\s*(?:DEADLYSIGNAL|CHECK failed|failed to)"
              r"|SUMMARY:\s*AddressSanitizer\b"
              r"|LeakSanitizer:\s*detected memory leaks",
              re.IGNORECASE,
          )


          def parse_gtest_list(text):
              suite = None
              ids = []
              for raw_line in text.splitlines():
                  if not raw_line.strip() or raw_line.lstrip().startswith("#"):
                      continue
                  indent = len(raw_line) - len(raw_line.lstrip())
                  line = raw_line.split("#", 1)[0].strip()
                  if not line:
                      continue
                  if indent == 0:
                      suite = line[:-1] if line.endswith(".") else None
                  elif suite:
                      ids.append(f"{suite}.{line}")
              return ids


          def asan_diagnostics(text):
              return [line for line in text.splitlines() if ASAN_ERROR.search(line)]


          def validate_list_text(text):
              actual = parse_gtest_list(text)
              disabled = [
                  test_id for test_id in actual
                  if any(part.startswith("DISABLED_") for part in re.split(r"[/.]", test_id))
              ]
              problems = []
              if not actual:
                  problems.append("GTest list is empty")
              if len(actual) != len(set(actual)):
                  problems.append("GTest list contains duplicate IDs")
              if collections.Counter(actual) != collections.Counter(F001_SELECTOR_IDS):
                  problems.append("GTest list does not equal the exact 24 F001 selector IDs")
              if disabled:
                  problems.append(f"GTest list contains disabled IDs: {disabled}")
              diagnostics = asan_diagnostics(text)
              if diagnostics:
                  problems.append(f"ASan diagnostics appeared during GTest list: {diagnostics}")
              selection = {
                  "filter": EXPECTED_FILTER,
                  "expected_count": len(F001_SELECTOR_IDS),
                  "expected_tests": F001_SELECTOR_IDS,
                  "listed_count": len(actual),
                  "listed_tests": actual,
                  "disabled_listed_tests": disabled,
                  "asan_diagnostics": diagnostics,
                  "problems": problems,
              }
              return selection, problems


          def xml_count(root, attribute, element_name):
              root_value = int(root.get(attribute, "0"))
              suite_sum = sum(int(node.get(attribute, "0")) for node in root.iter("testsuite"))
              element_count = sum(1 for _ in root.iter(element_name))
              return max(root_value, suite_sum, element_count)


          def validate_results(
              selection, xml_text, native_receipt, stdout_data, stderr_data
          ):
              problems = []
              if selection.get("filter") != EXPECTED_FILTER:
                  problems.append("Recorded filter differs from the exact F001 selector filter")
              if selection.get("expected_tests") != F001_SELECTOR_IDS:
                  problems.append("Recorded expected IDs differ from the verifier's exact F001 list")
              listed = selection.get("listed_tests", [])
              if selection.get("listed_count") != len(F001_SELECTOR_IDS):
                  problems.append("Pre-run list count is not exactly 24")
              if collections.Counter(listed) != collections.Counter(F001_SELECTOR_IDS):
                  problems.append("Pre-run list does not contain the exact 24 IDs")

              if xml_text is None:
                  root = None
                  cases, executed, not_run, xml_tests = [], [], [], None
                  counts = {
                      "failures": None,
                      "errors": None,
                      "skipped": None,
                      "disabled": None,
                  }
                  problems.append("GTest XML file is missing")
              else:
                  try:
                      root = ET.fromstring(xml_text)
                      if root.tag not in ("testsuites", "testsuite"):
                          raise ValueError(f"Unexpected GTest XML root: {root.tag}")
                      cases = list(root.iter("testcase"))
                      executed = [
                          f"{case.get('classname')}.{case.get('name')}"
                          for case in cases
                      ]
                      not_run = [
                          test_id for test_id, case in zip(executed, cases)
                          if case.get("status") not in (None, "run")
                          or case.get("result") not in (None, "completed")
                          or case.find("skipped") is not None
                          or case.find("disabled") is not None
                      ]
                      xml_tests = int(root.attrib["tests"])
                      counts = {
                          "failures": xml_count(root, "failures", "failure"),
                          "errors": xml_count(root, "errors", "error"),
                          "skipped": xml_count(root, "skipped", "skipped"),
                          "disabled": xml_count(root, "disabled", "disabled"),
                      }
                  except (ET.ParseError, KeyError, ValueError) as error:
                      root = None
                      cases, executed, not_run, xml_tests = [], [], [], None
                      counts = {
                          "failures": None,
                          "errors": None,
                          "skipped": None,
                          "disabled": None,
                      }
                      problems.append(f"Unable to read valid GTest XML: {error}")

              if root is not None:
                  if xml_tests != len(F001_SELECTOR_IDS):
                      problems.append(f"XML tests={xml_tests}; expected 24")
                  if len(cases) != len(F001_SELECTOR_IDS):
                      problems.append(f"XML testcase count={len(cases)}; expected 24")
                  if collections.Counter(executed) != collections.Counter(F001_SELECTOR_IDS):
                      problems.append("XML testcase IDs differ from the exact 24 F001 selectors")
                  if not_run:
                      problems.append(f"XML contains skipped, disabled, or unrun cases: {not_run}")
                  if any(value != 0 for value in counts.values()):
                      problems.append(f"XML has nonzero failures/errors/skips/disabled: {counts}")

              native_exit_status = int(native_receipt["native_exit_status"])
              if native_receipt.get("native_invocations") != 1:
                  problems.append("Native receipt does not record exactly one invocation")
              if native_receipt.get("gtest_filter") != EXPECTED_FILTER:
                  problems.append(
                      "Native receipt filter differs from the exact F001 selector filter"
                  )
              stdout_hash = hashlib.sha256(stdout_data).hexdigest()
              stderr_hash = hashlib.sha256(stderr_data).hexdigest()
              if native_receipt.get("stdout", {}).get("sha256") != stdout_hash:
                  problems.append("Native stdout does not match its persisted receipt hash")
              if native_receipt.get("stderr", {}).get("sha256") != stderr_hash:
                  problems.append("Native stderr does not match its persisted receipt hash")
              diagnostics = asan_diagnostics(
                  stdout_data.decode("utf-8", errors="replace")
                  + "\n"
                  + stderr_data.decode("utf-8", errors="replace")
              )
              if diagnostics:
                  problems.append(f"ASan diagnostics appeared in the native test log: {diagnostics}")
              if int(native_exit_status) != 0:
                  problems.append(f"mixxx-test exited with status {native_exit_status}")

              evidence = {
                  "filter": EXPECTED_FILTER,
                  "expected_count": len(F001_SELECTOR_IDS),
                  "expected_tests": F001_SELECTOR_IDS,
                  "listed_count": selection.get("listed_count"),
                  "listed_tests": listed,
                  "native_exit_status": int(native_exit_status),
                  "native_invocations": 1,
                  "native_receipt": native_receipt,
                  "xml_present": xml_text is not None,
                  "xml_tests": xml_tests,
                  "xml_testcases": len(cases),
                  "executed_tests": executed,
                  "not_run_tests": not_run,
                  **counts,
                  "asan_diagnostics": diagnostics,
                  "problems": problems,
              }
              return evidence, problems


          def write_json(path, data):
              Path(path).write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")


          def main(argv):
              if argv == ["filter"]:
                  print(EXPECTED_FILTER)
                  return 0
              if len(argv) == 3 and argv[0] == "before":
                  list_path, selection_path = argv[1:]
                  selection, problems = validate_list_text(
                      Path(list_path).read_text(encoding="utf-8")
                  )
                  write_json(selection_path, selection)
                  print(json.dumps(selection, indent=2))
                  if problems:
                      raise SystemExit("\n".join(problems))
                  return 0
              if len(argv) == 7 and argv[0] == "after":
                  (
                      selection_path,
                      xml_path,
                      receipt_path,
                      stdout_path,
                      stderr_path,
                      evidence_path,
                  ) = argv[1:]
                  selection = json.loads(Path(selection_path).read_text(encoding="utf-8"))
                  xml_text = (
                      Path(xml_path).read_text(encoding="utf-8")
                      if Path(xml_path).is_file()
                      else None
                  )
                  native_receipt = json.loads(
                      Path(receipt_path).read_text(encoding="utf-8")
                  )
                  stdout_data = Path(stdout_path).read_bytes()
                  stderr_data = Path(stderr_path).read_bytes()
                  evidence, problems = validate_results(
                      selection, xml_text, native_receipt, stdout_data, stderr_data
                  )
                  write_json(evidence_path, evidence)
                  print(json.dumps(evidence, indent=2))
                  if problems:
                      raise SystemExit("\n".join(problems))
                  return 0
              raise SystemExit(
                  "usage: verifier.py filter | before GTEST_LIST SELECTION_JSON | "
                  "after SELECTION_JSON GTEST_XML NATIVE_RECEIPT STDOUT STDERR EVIDENCE_JSON"
              )


          if __name__ == "__main__":
              raise SystemExit(main(sys.argv[1:]))
          PY

          test_filter="$(python3 verify_f001_asan_tests.py filter)"
          ./mixxx-test --gtest_list_tests --gtest_filter="$test_filter" > gtest-list.txt 2>&1
          python3 verify_f001_asan_tests.py before gtest-list.txt gtest-selection.json

          echo "Running exactly 24 F001 GTests once: $test_filter"
          set +e
          ./mixxx-test \
            --gtest_filter="$test_filter" \
            --gtest_output=xml:gtest-results.xml \
            > mixxx-test-asan.stdout.log \
            2> mixxx-test-asan.stderr.log
          native_exit_status=$?
          set -e
          python3 - "$native_exit_status" "$test_filter" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          def stream_record(path):
              content = Path(path).read_bytes()
              return {
                  "path": path,
                  "bytes": len(content),
                  "sha256": hashlib.sha256(content).hexdigest(),
              }

          receipt = {
              "native_invocations": 1,
              "native_exit_status": int(sys.argv[1]),
              "gtest_filter": sys.argv[2],
              "command": [
                  "./mixxx-test",
                  f"--gtest_filter={sys.argv[2]}",
                  "--gtest_output=xml:gtest-results.xml",
              ],
              "stdout": stream_record("mixxx-test-asan.stdout.log"),
              "stderr": stream_record("mixxx-test-asan.stderr.log"),
              "xml_path": "gtest-results.xml",
              "xml_present_at_native_exit": Path("gtest-results.xml").is_file(),
          }
          receipt_path = Path("mixxx-test-native-receipt.json")
          temporary_path = receipt_path.with_suffix(receipt_path.suffix + ".tmp")
          temporary_path.write_text(
              json.dumps(receipt, indent=2) + "\n", encoding="utf-8"
          )
          os.replace(temporary_path, receipt_path)
          print(json.dumps(receipt, indent=2))
          PY
          cat mixxx-test-asan.stdout.log
          cat mixxx-test-asan.stderr.log >&2
          python3 verify_f001_asan_tests.py after \
            gtest-selection.json gtest-results.xml \
            mixxx-test-native-receipt.json \
            mixxx-test-asan.stdout.log mixxx-test-asan.stderr.log \
            gtest-evidence.json

      - name: "Record ccache outcome and key metadata"
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = {
              "cache_prefix": os.environ["CCACHE_PREFIX"],
              "requested_key": os.environ.get("CCACHE_PRIMARY_KEY", ""),
              "matched_key": os.environ.get("CCACHE_MATCHED_KEY", ""),
              "exact_restore_hit": os.environ.get("CCACHE_RESTORE_HIT", "") == "true",
              "max_size": "2G",
              "build_outcome": os.environ.get("CCACHE_BUILD_OUTCOME", "not_run"),
              "save_outcome": os.environ.get("CCACHE_SAVE_OUTCOME", "not_run"),
              "save_conclusion": os.environ.get("CCACHE_SAVE_CONCLUSION", "not_run"),
          }
          path = Path("build/ccache-run-metadata.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(metadata, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(metadata, indent=2))
          PY
        env:
          CCACHE_PREFIX: f001-ubuntu-24.04-clang-18-qt-6.4-debug-asan-bungee-on-
          CCACHE_PRIMARY_KEY: ${{ steps.ccache_restore.outputs.cache-primary-key }}
          CCACHE_MATCHED_KEY: ${{ steps.ccache_restore.outputs.cache-matched-key }}
          CCACHE_RESTORE_HIT: ${{ steps.ccache_restore.outputs.cache-hit }}
          CCACHE_BUILD_OUTCOME: ${{ steps.build_mixxx_test.outcome || 'not_run' }}
          CCACHE_SAVE_OUTCOME: ${{ steps.ccache_save.outcome || 'not_run' }}
          CCACHE_SAVE_CONCLUSION: ${{ steps.ccache_save.conclusion || 'not_run' }}

      - name: "Upload F001 ASan review evidence"
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: f001-cloud-native-asan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            f001-source-binding.json
            build/ccache-stats.txt
            build/ccache-run-metadata.json
            build/gtest-list.txt
            build/gtest-selection.json
            build/gtest-results.xml
            build/gtest-evidence.json
            build/mixxx-test-native-receipt.json
            build/mixxx-test-asan.stdout.log
            build/mixxx-test-asan.stderr.log
          if-no-files-found: warn
          retention-days: 7
