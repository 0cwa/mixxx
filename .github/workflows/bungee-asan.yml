# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
#
# BNG-13: AddressSanitizer build that runs the Bungee scaler tests so any future
# overflow of m_contiguousChannelBuffer is caught at test time rather than in
# production.
#
# Scope:
#   - Linux only (clang sanitizers don't run on Windows MSVC and the Bungee
#     bug is not platform-specific).
#   - Builds only the mixxx-test target and runs focused Bungee,
#     ReadAheadManager, CachingReader, and SettingsManager keylock tests,
#     keeping the workflow lean compared with the matrix in build.yml.
#   - Fires on changes to the Bungee integration or reader code/tests; ignores
#     unrelated PRs.
#
# Detect_leaks=0 because mixxx-test has many process-lifetime singletons
# whose leaks would mask the heap-overflow signal we actually care about.
# halt_on_error=1 + abort_on_error=1 ensures the CI job fails immediately
# on the first ASan-detected issue with a usable backtrace.

name: Bungee ASan

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - "2.6"
      - feature/bungee
      - bungee-engine-full
    paths:
      - "cmake/modules/FindBungee.cmake"
      - "src/engine/enginebuffer.*"
      - "src/engine/readaheadmanager.*"
      - "src/engine/cachingreader/**"
      - "src/engine/controls/keycontrol.*"
      - "src/engine/bufferscalers/enginebufferscalebungee.*"
      - "src/preferences/settingsmanager.cpp"
      - "src/test/enginebufferscalebungee*"
      - "src/test/enginebufferbungee*"
      - "src/test/enginebufferalignmenttest.cpp"
      - "src/test/readaheadmanager_test.cpp"
      - "src/test/settingsmanager_test.cpp"
      - "lib/bungee/**"
      - "CMakeLists.txt"
      - ".github/workflows/bungee-asan.yml"
  pull_request:
    paths:
      - "cmake/modules/FindBungee.cmake"
      - "src/engine/enginebuffer.*"
      - "src/engine/readaheadmanager.*"
      - "src/engine/cachingreader/**"
      - "src/engine/controls/keycontrol.*"
      - "src/engine/bufferscalers/enginebufferscalebungee.*"
      - "src/preferences/settingsmanager.cpp"
      - "src/test/enginebufferscalebungee*"
      - "src/test/enginebufferbungee*"
      - "src/test/enginebufferalignmenttest.cpp"
      - "src/test/readaheadmanager_test.cpp"
      - "src/test/settingsmanager_test.cpp"
      - "lib/bungee/**"
      - "CMakeLists.txt"
      - ".github/workflows/bungee-asan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asan:
    name: Linux ASan + Bungee tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      CC: clang
      CXX: clang++
      # Address sanitizer runtime options.
      # detect_leaks=0:   we are hunting heap overflows, not leaks; mixxx-test
      #                   has many process-lifetime singletons that would
      #                   otherwise drown the signal.
      # halt_on_error=1:  fail fast on first overflow.
      # abort_on_error=1: produce a coredump-style backtrace via SIGABRT.
      # strict_string_checks=1: catch off-by-one in string ops too.
      ASAN_OPTIONS: "detect_leaks=0:halt_on_error=1:abort_on_error=1:strict_string_checks=1:print_summary=1"
      # Instrument the vendored Bungee target and its Mixxx test binary.
      CFLAGS: "-fsanitize=address -fno-omit-frame-pointer"
      CXXFLAGS: "-fsanitize=address -fno-omit-frame-pointer"
      # Retain an explicit sanitizer link flag for the static vendor target.
      LDFLAGS: "-fsanitize=address"
      # ASAN_OPTIONS already disables leak detection. Keep exitcode=0 as a
      # belt-and-suspenders guard so leak noise cannot mask heap-overflow
      # regressions if LSan is re-enabled later.
      LSAN_OPTIONS: "exitcode=0"

    steps:
      - name: "Check out repository"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # `git describe` (used by version stamping) needs full history.
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: "Ensure that all tags are fetched"
        run: git fetch origin --force --tags

      - name: "Set up gcc/clang problem matcher"
        uses: ammaraskar/gcc-problem-matcher@0f9c86f9e693db67dacf53986e1674de5f2e5f28 # 0.3.0

      - name: "Set up build environment (apt deps)"
        run: tools/debian_buildenv.sh setup
        env:
          BUILDENV_BASEPATH: /home/runner/buildenv

      - name: "Install clang + ASan runtime"
        run: |
          sudo apt-get install -y --no-install-recommends clang lld llvm
          clang --version

      - name: "Set up ccache"
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /home/runner/.cache/ccache
          key: ubuntu-24.04-asan-${{ github.ref }}-${{ github.run_number }}
          restore-keys: |
            ubuntu-24.04-asan-${{ github.ref }}
            ubuntu-24.04-asan-

      - name: "Configure ccache"
        run: |
          sudo apt-get install -y --no-install-recommends ccache
          ccache --zero-stats
          ccache --max-size=2G

      - name: "Create build directory"
        run: mkdir build

      # Minimal feature set: enable BUNGEE + tests + ASan; everything that
      # would just cost compile time without exercising the Bungee path is
      # turned OFF.  BUILD_BENCH is OFF so we don't depend on libpfm.
      - name: "Configure (CMake, ASan)"
        working-directory: build
        run: >-
          cmake -S .. -B .
          -DCMAKE_BUILD_TYPE=Debug
          -DBUNGEE=ON
          -DSANITIZE_ADDRESS=ON
          -DBUILD_TESTING=ON
          -DBUILD_BENCH=OFF
          -DDEBUG_ASSERTIONS_FATAL=OFF
          -DWARNINGS_FATAL=OFF
          -DBATTERY=OFF
          -DBROADCAST=OFF
          -DKEYFINDER=OFF
          -DLILV=OFF
          -DOPUS=OFF
          -DQTKEYCHAIN=OFF
          -DVINYLCONTROL=ON
          -DHID=OFF
          -DBULK=OFF
          -DLOCALECOMPARE=OFF
          -DMAD=OFF
          -DMODPLUG=OFF
          -DWAVPACK=OFF
          -DFFMPEG=OFF
          -DDOWNLOAD_MANUAL=OFF
          -DINSTALL_USER_UDEV_RULES=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: "Build mixxx-test"
        working-directory: build
        run: cmake --build . --target mixxx-test -j"$(nproc)"

      - name: "Determine compiled RubberBand R3 capability"
        working-directory: build
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, shlex, shutil, subprocess
          from pathlib import Path

          unit = Path("src/engine/bufferscalers/enginebufferscalerubberband.cpp")
          source = (Path.cwd().parent / unit).resolve()
          db = json.loads(Path("compile_commands.json").read_text(encoding="utf-8"))
          rows = [row for row in db if (Path(row["directory"]) / row["file"]).resolve() == source]
          if len(rows) != 1:
              raise SystemExit(f"Expected one compile command for {unit}, got {len(rows)}")
          row = rows[0]
          original = list(row.get("arguments") or shlex.split(row.get("command", "")))
          if not original:
              raise SystemExit("Compile database command is empty")
          command = original.copy()
          if Path(command[0]).name == "ccache":
              command.pop(0)
          compiler = shutil.which(command.pop(0)) if command else None
          configured = shutil.which(os.environ.get("CXX", ""))
          if not compiler or not configured or Path(compiler).resolve() != Path(configured).resolve():
              raise SystemExit("Compile database compiler does not match configured CXX")

          pairs = {"-o", "-MF", "-MT", "-MQ", "-MJ", "-dependency-file", "--serialize-diagnostics"}
          drop = {"-c", "-S", "-M", "-MM", "-MD", "-MMD", "-MP", "-emit-obj",
                  "-emit-llvm", "-fsyntax-only", "--coverage", "-pg"}
          codegen = ("-O", "-g", "-fPIC", "-fpic", "-fPIE", "-fpie", "-fno-pic",
                     "-fno-PIC", "-fno-pie", "-fno-PIE", "-fvisibility", "-fstack-protector",
                     "-fno-stack-protector", "-fno-omit-frame-pointer", "-fomit-frame-pointer",
                     "-fdata-sections", "-ffunction-sections", "-flto", "-fsanitize=",
                     "-fno-sanitize=", "-fprofile-", "-fcoverage-", "-fno-common", "-fno-plt",
                     "-fno-semantic-interposition", "-fno-integrated-as", "-save-temps",
                     "-ftime-trace", "-fmodules-cache-path=", "-fmodule-cache-path=",
                     "-fmodule-output=", "-foptimization-record-file=",
                     "-fdiagnostics-serialize-file=")
          flags, i = [], 0
          while i < len(command):
              arg = command[i]
              if arg.startswith("@"):
                  raise SystemExit("Response-file compile command is unsupported")
              if arg in pairs:
                  if i + 1 == len(command):
                      raise SystemExit(f"Missing output/dependency value after {arg}")
                  i += 2
                  continue
              if arg in drop or arg.startswith(codegen):
                  i += 1
                  continue
              if (arg.startswith(("-MF", "-MT", "-MQ", "-MJ")) and len(arg) > 3
                      or arg.startswith(("--dependency-file=", "--serialize-diagnostics="))):
                  i += 1
                  continue
              if arg.startswith("-o") and len(arg) > 2:
                  raise SystemExit(f"Attached compiler output flag is unsupported: {arg}")
              if arg in ("-fmodules", "-fcxx-modules", "-Xclang", "-Xpreprocessor"):
                  raise SystemExit(f"Unsupported compiler forwarding/module flag: {arg}")
              if arg.startswith("-Wp,") and any(
                      dep in arg for dep in ("-MD", "-MMD", "-MF", "-MT", "-MQ")):
                  raise SystemExit(f"Bundled dependency flag is unsupported: {arg}")
              path = Path(arg)
              if not path.is_absolute():
                  path = Path(row["directory"]) / path
              if path.resolve() != source:
                  flags.append(arg)
              i += 1

          output = subprocess.run([compiler, *flags, "-E", "-dM", "-x", "c++", str(source)],
                                  cwd=row["directory"], check=True, capture_output=True, text=True).stdout
          macros = dict(re.findall(r"^#define[ \t]+(\w+)[ \t]*(.*)$", output, re.MULTILINE))
          predicate = "(RUBBERBAND_API_MAJOR_VERSION>=3||(RUBBERBAND_API_MAJOR_VERSION==2&&RUBBERBAND_API_MINOR_VERSION>=7))"
          if ("__RUBBERBAND__" not in macros or
                  re.sub(r"\s+", "", macros.get("RUBBERBANDV3", "")) != predicate):
              raise SystemExit("Compiled RubberBand define or production R3 predicate is missing")

          def api_version(name):
              match = re.fullmatch(r"\(?\s*(\d+)\s*\)?", macros.get(name, ""))
              if not match:
                  raise SystemExit(f"Missing or malformed compiled macro {name}")
              return int(match.group(1))

          major, minor = api_version("RUBBERBAND_API_MAJOR_VERSION"), api_version("RUBBERBAND_API_MINOR_VERSION")
          r3_available = major >= 3 or (major == 2 and minor >= 7)
          receipt = {
              "translation_unit": unit.as_posix(),
              "compile_command_sha256": hashlib.sha256(json.dumps(original, separators=(",", ":")).encode()).hexdigest(),
              "rubberband_enabled": True,
              "api_major": major,
              "api_minor": minor,
              "predicate": predicate,
              "r3_available": r3_available,
              "excluded_tests": ([{
                  "id": "SettingsManagerTest.RejectsUnavailableRubberBandR3GlobalKeylockEngine",
                  "reason": ("Compiled RUBBERBANDV3 is true; this test requires R3 to be unavailable. "
                             "Available-engine migration remains selected."),
              }] if r3_available else []),
          }
          Path("rubberband-capability.json").write_text(json.dumps(receipt, indent=2) + "\n",
                                                       encoding="utf-8")
          print(json.dumps(receipt, indent=2))
          PY

      - name: "Print ccache stats"
        run: ccache --show-stats

      # Run focused Bungee, reader retry, and SettingsManager keylock tests
      # under ASan. The full mixxx-test suite under ASan would run for >30
      # minutes; this targeted run covers the instrumented Bungee and reader
      # paths.
      - name: "Run Bungee and reader tests under ASan"
        working-directory: build
        env:
          GTEST_COLOR: "1"
        run: |
          set -euo pipefail
          cat > verify_bungee_asan_tests.py <<'PY'
          import collections
          import fnmatch
          import json
          import re
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          BASE_PATTERNS = ["*Bungee*", "SettingsManagerTest.*KeylockEngine*",
                           "ReadAheadManagerTest.*", "CachingReader*.*"]
          BASE_FILTER = ":".join(BASE_PATTERNS)
          UNAVAILABLE_TEST = "SettingsManagerTest.RejectsUnavailableRubberBandR3GlobalKeylockEngine"
          MIGRATION_TEST = "SettingsManagerTest.MigratesAvailableOptionalGlobalKeylockEngines"
          PREDICATE = "(RUBBERBAND_API_MAJOR_VERSION>=3||(RUBBERBAND_API_MAJOR_VERSION==2&&RUBBERBAND_API_MINOR_VERSION>=7))"

          def list_ids(path):
              suite = None
              ids = []
              for line in Path(path).read_text(encoding="utf-8").splitlines():
                  text = line.split("#", 1)[0].strip()
                  if not text:
                      continue
                  if line[0].isspace():
                      if suite:
                          ids.append(f"{suite}.{text}")
                  else:
                      suite = text[:-1] if text.endswith(".") else None
              return ids

          def xml_count(root, attribute, element):
              suites = list(root.iter("testsuite"))
              return max(int(root.get(attribute, "0")),
                         sum(int(suite.get(attribute, "0")) for suite in suites),
                         sum(1 for _ in root.iter(element)))

          def read_capability(path):
              cap = json.loads(Path(path).read_text(encoding="utf-8"))
              if (not isinstance(cap, dict)
                      or cap.get("translation_unit") !=
                      "src/engine/bufferscalers/enginebufferscalerubberband.cpp"
                      or cap.get("rubberband_enabled") is not True
                      or cap.get("predicate") != PREDICATE
                      or type(cap.get("r3_available")) is not bool
                      or type(cap.get("api_major")) is not int
                      or type(cap.get("api_minor")) is not int
                      or cap.get("r3_available") != (cap["api_major"] >= 3 or
                                                      (cap["api_major"] == 2 and cap["api_minor"] >= 7))
                      or cap.get("excluded_tests") != ([{
                          "id": UNAVAILABLE_TEST,
                          "reason": ("Compiled RUBBERBANDV3 is true; this test requires R3 to be unavailable. "
                                     "Available-engine migration remains selected."),
                      }] if cap.get("r3_available") else [])
                      or not re.fullmatch(r"[0-9a-f]{64}", cap.get("compile_command_sha256", ""))):
                  raise ValueError("Compiled RubberBand capability receipt is invalid")
              return cap

          def test_filter(cap):
              excluded = [item["id"] for item in cap["excluded_tests"]]
              return BASE_FILTER + (f"-{':'.join(excluded)}" if excluded else "")

          if __name__ == "__main__":
              mode, *arguments = sys.argv[1:]
              if mode == "before" and len(arguments) == 3:
                  list_path, capability_path, output_path = arguments
                  cap = read_capability(capability_path)
                  positive = list_ids(list_path)
                  excluded = cap["excluded_tests"]
                  excluded_ids = {item["id"] for item in excluded}
                  tests = [test for test in positive if test not in excluded_ids]
                  disabled = [test for test in tests if any(
                      part.startswith("DISABLED_") for part in re.split(r"[/.]", test)
                  )]
                  families = {pattern: [test for test in tests if fnmatch.fnmatchcase(test, pattern)]
                              for pattern in BASE_PATTERNS}
                  selection = {"filter": test_filter(cap),
                               "positive_filter_listed_tests": positive, "excluded_tests": excluded,
                               "listed_count": len(tests), "listed_tests": tests,
                               "compiled_capability": cap, "disabled_listed_tests": disabled,
                               "families": families}
                  Path(output_path).write_text(json.dumps(selection, indent=2) + "\n")
                  problems = []
                  if not positive or len(set(positive)) != len(positive):
                      problems.append("Positive family list is empty or contains duplicate IDs")
                  if UNAVAILABLE_TEST not in positive:
                      problems.append(f"Positive family list omits {UNAVAILABLE_TEST}")
                  if MIGRATION_TEST not in tests:
                      problems.append("Available-engine migration test is missing")
                  if disabled:
                      problems.append(f"Selected filter lists disabled tests: {disabled}")
                  for pattern, matched in families.items():
                      print(f"Selected {len(matched)} tests for {pattern}")
                      if not matched:
                          problems.append(f"No tests matched GTest family filter: {pattern}")
                  print(json.dumps(selection, indent=2))
                  if problems:
                      raise SystemExit("\n".join(problems))
              elif mode == "after" and len(arguments) == 6:
                  selection = json.loads(Path(arguments[0]).read_text())
                  cap = read_capability(arguments[4])
                  positive = selection.get("positive_filter_listed_tests", [])
                  excluded = cap["excluded_tests"]
                  tests = [test for test in positive if test not in {item["id"] for item in excluded}]
                  problems = []
                  if selection.get("compiled_capability") != cap:
                      problems.append("Selection capability differs from compiled receipt")
                  if selection.get("filter") != test_filter(cap) or arguments[5] != selection.get("filter"):
                      problems.append("Executed filter differs from compiled capability selection")
                  if UNAVAILABLE_TEST not in positive or selection.get("excluded_tests") != excluded:
                      problems.append("Recorded exclusion differs from the exact capability-based exclusion")
                  if selection.get("listed_tests") != tests or selection.get("listed_count") != len(tests):
                      problems.append("Selected IDs differ from the positive list and exact exclusion")
                  if MIGRATION_TEST not in tests:
                      problems.append("Available-engine migration test is absent from selected IDs")
                  expected_families = {
                      pattern: [test for test in tests if fnmatch.fnmatchcase(test, pattern)]
                      for pattern in BASE_PATTERNS
                  }
                  if selection.get("families") != expected_families:
                      problems.append("Recorded family membership differs from selected IDs")
                  native_status = int(arguments[2])
                  try:
                      root = ET.parse(arguments[1]).getroot()
                      if root.tag not in ("testsuites", "testsuite"):
                          raise ValueError(f"Unexpected GTest XML root: {root.tag}")
                      cases = list(root.iter("testcase"))
                      executed = [f"{case.get('classname')}.{case.get('name')}" for case in cases]
                      not_run = [test for test, case in zip(executed, cases)
                                 if case.get("status") in ("notrun", "skipped")
                                 or case.get("result") in ("suppressed", "skipped")]
                      xml_tests = int(root.attrib["tests"]) if "tests" in root.attrib else None
                      counts = {name: xml_count(root, name, element) for name, element in
                                (("failures", "failure"), ("errors", "error"),
                                 ("skipped", "skipped"), ("disabled", "disabled"))}
                  except (OSError, ET.ParseError, KeyError, ValueError) as error:
                      root, cases, executed, not_run, xml_tests = None, [], [], [], None
                      counts = {name: None for name in ("failures", "errors", "skipped", "disabled")}
                      problems.append(f"Unable to read valid GTest XML: {error}")
                  if root is not None:
                      if xml_tests != len(selection["listed_tests"]):
                          problems.append(f"XML tests={xml_tests}; listed={len(selection['listed_tests'])}")
                      if len(cases) != len(selection["listed_tests"]):
                          problems.append(f"XML testcases={len(cases)}; listed={len(selection['listed_tests'])}")
                      if collections.Counter(executed) != collections.Counter(selection["listed_tests"]):
                          problems.append("XML testcase IDs differ from the exact pre-run list")
                      if not_run:
                          problems.append(f"XML has testcases that did not run: {not_run}")
                      if any(counts[name] for name in counts):
                          problems.append(f"XML nonzero failures/errors/skips/disabled: {counts}")
                  family_result = {}
                  for pattern, listed in selection["families"].items():
                      ran = [test for test in executed if fnmatch.fnmatchcase(test, pattern)]
                      exact = bool(listed) and collections.Counter(ran) == collections.Counter(listed)
                      family_result[pattern] = {"listed": listed, "executed": ran, "exact": exact}
                      if not exact:
                          problems.append(f"XML family membership differs for {pattern}")
                  if native_status != 0:
                      problems.append(f"mixxx-test exited with status {native_status}")
                  evidence = {"filter": selection["filter"],
                              "positive_filter_listed_count": len(positive), "excluded_tests": excluded,
                              "compiled_capability": cap, "listed_count": len(selection["listed_tests"]),
                              "listed_tests": selection["listed_tests"], "native_exit_status": native_status,
                              "xml_tests": xml_tests, "xml_testcases": len(cases), "not_run_tests": not_run, **counts,
                              "families": family_result, "executed_tests": executed, "problems": problems}
                  Path(arguments[3]).write_text(json.dumps(evidence, indent=2) + "\n")
                  print(json.dumps(evidence, indent=2))
                  if problems:
                      raise SystemExit("\n".join(problems))
              else:
                  raise SystemExit(
                      "usage: verifier.py before LIST CAPABILITY SELECTION | "
                      "after SELECTION XML EXIT EVIDENCE CAPABILITY FILTER"
                  )
          PY

          base_filter='*Bungee*:SettingsManagerTest.*KeylockEngine*:ReadAheadManagerTest.*:CachingReader*.*'
          ./mixxx-test --gtest_list_tests --gtest_filter="$base_filter" > gtest-list.txt 2>&1
          python3 verify_bungee_asan_tests.py before gtest-list.txt rubberband-capability.json gtest-selection.json
          test_filter="$(python3 -c 'import json; print(json.load(open("gtest-selection.json"))["filter"])')"
          test_count="$(python3 -c 'import json; print(json.load(open("gtest-selection.json"))["listed_count"])')"
          echo "Running $test_count tests matching GTest filter: $test_filter"
          set +e
          ./mixxx-test --gtest_filter="$test_filter" --gtest_output=xml:gtest-results.xml
          native_exit_status=$?
          set -e
          python3 verify_bungee_asan_tests.py after gtest-selection.json gtest-results.xml "$native_exit_status" gtest-evidence.json rubberband-capability.json "$test_filter"
