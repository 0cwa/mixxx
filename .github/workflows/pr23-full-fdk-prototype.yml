# AI-generated dedicated PR23 Flatpak artifact workflow begins.
name: PR23 full-FDK technical prototype

on:
  push:
    branches:
      - audit/pr23-full-fdk-technical-prototype-20261008
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_SOURCE_SHA: 2b0f5b304fb66e67c7415a6f2232e60042e27790

jobs:
  build-flatpak:
    name: "Flatpak"
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:6b90b58b2f100fc12c10a24da62c5a47163e1f9013bd200df0ca60fe3cc7255a
      options: --privileged
      volumes:
        - /usr:/host/usr
        - /opt:/host/opt
    strategy:
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.variant.runner }}
    steps:
      - name: "Recover host disk space"
        run: |
          rm -rf /host/opt/hostedtoolcache/CodeQL
          rm -rf /host/opt/hostedtoolcache/go
          rm -rf /host/usr/local/lib/android
          rm -rf /host/usr/local/.ghcup
          rm -rf /host/usr/local/share/powershell
          rm -rf /host/usr/share/swift
          rm -rf /host/usr/share/dotnet

      - name: "Check out repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: 2b0f5b304fb66e67c7415a6f2232e60042e27790

      - name: "Store Git version"
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          GIT_DESC=$(git describe --always --first-parent --dirty=-modified)
          if [ -z "$GIT_DESC" ]; then
            GIT_DESC="unknown"
          fi
          echo "GIT_DESC=$GIT_DESC" >> $GITHUB_ENV

      - name: "Record immutable source and manifest"
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD:src)" = "1de8e2c8b22617d7723ccd97745cd87fb73a44c7"
          mkdir -p flatpak-evidence
          {
            echo "expected_source_sha=$EXPECTED_SOURCE_SHA"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "src_tree=$(git rev-parse HEAD:src)"
            echo "workflow_commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            git status --porcelain
          } > flatpak-evidence/source-provenance.txt
          cp packaging/flatpak/org.mixxx.Mixxx.yaml flatpak-evidence/manifest.yaml
          sha256sum packaging/flatpak/org.mixxx.Mixxx.yaml CMakeLists.txt \
            > flatpak-evidence/source-config-sha256.txt
          flatpak --version > flatpak-evidence/flatpak-version.txt
          flatpak-builder --version > flatpak-evidence/flatpak-builder-version.txt

      - name: "Build Flatpak"
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/org.mixxx.Mixxx.yaml
          arch: ${{ matrix.variant.arch }}
          build-bundle: false
          upload-artifact: false
          keep-build-dirs: true
          build-dir: flatpak_app
          # The Flatpak caches (~1.4 GB per arch) are only saved by branch pushes
          # (main and the release branches) to stay within the 10 GB quota.
          # Pull requests can still restore the cache of their base branch.
          save-cache: false

      - name: "Collect staged feature and loader evidence"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p flatpak-evidence
          trap 'rc=$?; echo "Collection command failed ($rc): $BASH_COMMAND" >&2; for receipt in flatpak-evidence/sdk-ldd.txt flatpak-evidence/staged-readelf.txt flatpak-evidence/cache-paths.txt; do if test -f "$receipt"; then echo "=== $receipt ===" >&2; cat "$receipt" >&2; fi; done; exit "$rc"' ERR
          flatpak list --columns=application,arch,branch \
            > flatpak-evidence/runtime-inventory.txt
          for runtime_ref in org.kde.Platform/x86_64/6.10 org.kde.Sdk/x86_64/6.10; do
            printf '%s ' "$runtime_ref" >> flatpak-evidence/runtime-commits.txt
            flatpak info --show-commit "$runtime_ref" \
              >> flatpak-evidence/runtime-commits.txt
          done
          if test -d .flatpak-builder/build; then
            if command -v rg >/dev/null; then
              rg --files --hidden --no-ignore --follow .flatpak-builder/build \
                | sort > flatpak-evidence/build-file-paths.txt
            else
              find -L .flatpak-builder/build -type f | sort \
                > flatpak-evidence/build-file-paths.txt
            fi
            awk '/\/(mixxx-[^/]+|build-mixxx)\/.*CMakeCache\.txt$/' \
              flatpak-evidence/build-file-paths.txt > flatpak-evidence/cache-paths.txt
            while IFS= read -r cache_path; do
              cache_parent="$(dirname "$cache_path")"
              evidence_id="cache_$(echo "$cache_path" | tr / _)"
              cp "$cache_path" "flatpak-evidence/$evidence_id"
              if test -f "$cache_parent/compile_commands.json"; then
                cp "$cache_parent/compile_commands.json" \
                  "flatpak-evidence/${evidence_id%.txt}-compile_commands.json"
              fi
            done < flatpak-evidence/cache-paths.txt
            awk 'tolower($0) ~ /bungee|signalsmith|rubberband|soundtouch|fdk|keyfinder|hidapi|libusb|lv2|lilv|vinyl/' \
              flatpak-evidence/build-file-paths.txt \
              > flatpak-evidence/feature-build-paths.txt
          fi
          if test -f flatpak_app/files/bin/mixxx.bin; then
            sha256sum flatpak_app/files/bin/mixxx.bin \
              > flatpak-evidence/staged-binary-sha256.txt
            find flatpak_app/files -type f | sort \
              > flatpak-evidence/staged-file-paths.txt
            awk '/plugins|qml|lv2|mixxx.bin|fdk|keyfinder|hidapi|libusb/' \
              flatpak-evidence/staged-file-paths.txt \
              > flatpak-evidence/plugin-library-inventory.txt
            # SDK sandbox invocation is auxiliary evidence; the installed
            # production Platform closure remains a mandatory later gate.
            if flatpak-builder --run flatpak_app packaging/flatpak/org.mixxx.Mixxx.yaml \
                sh -c 'ldd /app/bin/mixxx.bin' \
                > flatpak-evidence/sdk-ldd.txt 2>&1; then
              echo 'SDK loader invocation succeeded' > flatpak-evidence/sdk-loader-status.txt
              if grep -q 'not found' flatpak-evidence/sdk-ldd.txt; then
                echo "Staged binary has unresolved SDK dependencies" >&2
                exit 1
              fi
            else
              sdk_rc=$?
              echo "SDK loader invocation unavailable (exit $sdk_rc); production runtime gate is still required" \
                | tee flatpak-evidence/sdk-loader-status.txt
              cat flatpak-evidence/sdk-ldd.txt
            fi
            if command -v readelf >/dev/null; then
              readelf -h -d flatpak_app/files/bin/mixxx.bin \
                > flatpak-evidence/staged-readelf.txt 2>&1
            else
              flatpak run --command=readelf --filesystem="$PWD/flatpak_app/files:ro" \
                org.kde.Sdk/x86_64/6.10 -h -d "$PWD/flatpak_app/files/bin/mixxx.bin" \
                > flatpak-evidence/staged-readelf.txt 2>&1
            fi
            if ! test -s flatpak-evidence/cache-paths.txt; then
              echo 'No retained Mixxx CMakeCache found' >&2
              cat flatpak-evidence/build-file-paths.txt >&2
              exit 1
            fi
          fi

      - name: "Create Flatpak bundle"
        run: |
          flatpak build-bundle repo \
            --arch=${{ matrix.variant.arch }} \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            Mixxx-${GIT_DESC}-${{ matrix.variant.arch }}.flatpak org.mixxx.Mixxx

      - name: "Hash the application bundle"
        shell: bash
        run: |
          sha256sum "Mixxx-${GIT_DESC}-${{ matrix.variant.arch }}.flatpak" > flatpak-evidence/application-bundle-sha256.txt

      - name: "Check shipped runtime dependency closure"
        shell: bash
        run: |
          bundle="Mixxx-${GIT_DESC}-${{ matrix.variant.arch }}.flatpak"
          set -- "$bundle" flatpak-evidence
          # AI-generated production-runtime dependency capture begins.
          set -euo pipefail
          bundle=$1
          receipt_dir=$2
          mkdir -p "$receipt_dir"
          receipt_dir=$(realpath "$receipt_dir")
          trap 'rc=$?; echo "Runtime command failed ($rc): $BASH_COMMAND" >&2; for receipt in "$receipt_dir/runtime-install.txt" "$receipt_dir/platform-runtime-install.txt" "$receipt_dir/production-runtime-closure.txt"; do if test -f "$receipt"; then echo "=== $receipt ===" >&2; tail -n 120 "$receipt" >&2; fi; done; exit "$rc"' ERR
          # This installation is confined to the CI task workspace.
          export XDG_DATA_HOME="$PWD/.pr23-parity-data"
          export FLATPAK_USER_DIR="$PWD/.pr23-parity-data/flatpak"
          mkdir -p "$FLATPAK_USER_DIR"
          flatpak --user install -y --no-deps --no-related "$bundle" > "$receipt_dir/runtime-install.txt" 2>&1
          flatpak --user info --show-metadata org.mixxx.Mixxx > "$receipt_dir/installed-app-metadata.txt"
          flatpak --user info --show-runtime org.mixxx.Mixxx > "$receipt_dir/installed-runtime-ref.txt"
          runtime_ref="$(cat "$receipt_dir/installed-runtime-ref.txt")"
          test "$runtime_ref" = "org.kde.Platform/x86_64/6.10"
          flatpak --user remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y flathub "$runtime_ref" \
            > "$receipt_dir/platform-runtime-install.txt" 2>&1
          flatpak --user info --show-commit "$runtime_ref" \
            > "$receipt_dir/installed-platform-commit.txt"
          flatpak --user info --show-metadata "$runtime_ref" \
            > "$receipt_dir/installed-platform-metadata.txt"
          # Only the runtime shell and loader are invoked; Mixxx is never launched.
          flatpak run --user --nofilesystem=home --nofilesystem=host --command=sh org.mixxx.Mixxx -c '
            set -eu
            echo "PRODUCTION RUNTIME: $(cat /.flatpak-info)"
            echo "=== app executable loader closure ==="
            ldd /app/bin/mixxx.bin
            echo "=== required dynamic FDK encoder provider ==="
            provider=$(find /app/lib /usr/lib -name "libfdk-aac.so.2" -print -quit)
            test -n "$provider"
            ls -l "$provider"
            ldd "$provider"
            echo "=== Qt SQL, SVG, platform and QML plugin inventory ==="
            find /app/lib /usr/lib -type f \( -name "libqsqlite.so" -o -name "libqsvg.so" -o -name "libqxcb.so" -o -name "libqwayland*.so" -o -name "qmldir" \) -print
            for kind in libqsqlite.so libqsvg.so libqxcb.so; do
              plugin=$(find /app/lib /usr/lib -type f -name "$kind" -print -quit)
              test -n "$plugin"
              echo "=== $plugin ==="
              ldd "$plugin"
            done
            echo "=== QML shared module loader closure ==="
            find /app/lib /usr/lib -path "*/qml/*" -type f -name "*.so" -exec sh -c '\''for p do echo "=== $p ==="; ldd "$p"; done'\'' sh {} +
            echo "=== app shipped library inventory ==="
            find /app/lib -type f -name "*.so*" -print
          ' > "$receipt_dir/production-runtime-closure.txt" 2>&1
          if grep -q 'not found' "$receipt_dir/production-runtime-closure.txt"; then
            echo 'Production runtime closure contains a missing library.' >&2
            exit 1
          fi
          # End AI-generated production-runtime dependency capture.

      - name: "Require source QML modules and Wayland integrations"
        shell: bash
        env:
          XDG_DATA_HOME: ${{ github.workspace }}/.pr23-parity-data
          FLATPAK_USER_DIR: ${{ github.workspace }}/.pr23-parity-data/flatpak
        run: |
          #!/usr/bin/env bash
          # AI-generated source-derived QML and Wayland runtime gate begins.
          set -euo pipefail
          receipt_dir=flatpak-evidence
          mkdir -p "$receipt_dir"
          receipt_dir=$(realpath "$receipt_dir")
          trap 'rc=$?; echo "QML/Wayland command failed ($rc): $BASH_COMMAND" >&2; if test -f "$receipt_dir/qml-wayland-runtime-gate.txt"; then tail -n 160 "$receipt_dir/qml-wayland-runtime-gate.txt" >&2; fi; exit "$rc"' ERR
          # Run from the immutable source checkout. Only actual external Qt imports count.
          python3 - "$receipt_dir/required-qt-qml-modules.txt" <<'PY_MODULES'
          import pathlib,re,sys
          modules=set()
          for root in [pathlib.Path("res/qml"),pathlib.Path("res/skins")]:
              for path in root.rglob("*.qml"):
                  for module in re.findall(r"^\s*import\s+(Qt[\w.]*)",path.read_text(),re.M):
                      modules.add(module)
          assert modules
          pathlib.Path(sys.argv[1]).write_text("\n".join(sorted(modules))+"\n")
          PY_MODULES
          mapfile -t required < "$receipt_dir/required-qt-qml-modules.txt"
          # No QML engine, Mixxx binary, display or audio device is launched.
          runtime_script=$(cat <<'PR23_QML_RUNTIME'
            set -eu
            queue=$(mktemp -d)
            trap 'rm -rf "$queue"' EXIT
            printf "%s\n" "$@" > "$queue/pending"
            touch "$queue/seen"
            while IFS= read -r uri; do
              if grep -Fxq "$uri" "$queue/seen"; then continue; fi
              printf "%s\n" "$uri" >> "$queue/seen"
              relative=$(printf "%s" "$uri" | tr . /)
              descriptor=$(find /app/lib /usr/lib /app/share /usr/share -path "*/qml/$relative/qmldir" -print -quit)
              test -n "$descriptor" || { echo "MISSING_QML_MODULE $uri"; exit 1; }
              awk -v uri="$uri" '$1=="module" && $2==uri {found=1} END {exit !found}' "$descriptor"
              echo "QML_MODULE $uri $descriptor"
              awk '$1=="depends" || $1=="import" {print $2}' "$descriptor" >> "$queue/pending"
              directory=${descriptor%/*}
              for name in $(awk '$1=="plugin" {print $2} $1=="optional" && $2=="plugin" {print $3}' "$descriptor"); do
                plugin=$(find "$directory" -name "lib$name.so" -print -quit)
                test -n "$plugin" || { echo "MISSING_QML_PLUGIN $uri $name"; exit 1; }
                echo "QML_PLUGIN $plugin"
                closure=$(ldd "$plugin"); printf "%s\n" "$closure"
                case "$closure" in *"not found"*) exit 1;; esac
              done
            done < "$queue/pending"
            descriptor=$(find /app/share -path "*/qml/Mixxx/qmldir" -print -quit)
            test -n "$descriptor"
            awk '$1=="module" && $2=="Mixxx" {found=1} END {exit !found}' "$descriptor"
            app_qml=${descriptor%/Mixxx/qmldir}
            for resource in Mixxx/DurationFormatter.qml Mixxx/MathUtils.mjs Mixxx/Controls/WaveformDisplay.qml Mixxx/Controls/WaveformOverview.qml; do
              test -f "$app_qml/$resource"
              echo "APP_QML_FILE $app_qml/$resource"
            done
            echo "APP_QML_EMBEDDED_DECLARATIONS :/mixxx.org/imports/Mixxx/qmldir :/mixxx.org/imports/Mixxx/Controls/qmldir"
            # Embedded registrations are canonical source provenance, not executed resource lookup.
            wayland=$(find /app/lib /usr/lib -type f \( -path "*/platforms/libqwayland.so" -o -path "*/platforms/libqwayland-generic.so" -o -path "*/platforms/libqwayland-egl.so" \) -print -quit)
            test -n "$wayland" || { echo "MISSING_WAYLAND_PLATFORM_PLUGIN"; exit 1; }
            echo "WAYLAND_PLATFORM_PLUGIN $wayland"
            closure=$(ldd "$wayland"); printf "%s\n" "$closure"
            case "$closure" in *"not found"*) exit 1;; esac
            for integration in wayland-graphics-integration-client wayland-shell-integration; do
              providers=$(find /app/lib /usr/lib -type f -path "*/$integration/*.so" -print)
              test -n "$providers" || { echo "MISSING_WAYLAND_INTEGRATION $integration"; exit 1; }
              printf "%s\n" "$providers" | while IFS= read -r provider; do
                echo "WAYLAND_INTEGRATION $provider"
                closure=$(ldd "$provider"); printf "%s\n" "$closure"
                case "$closure" in *"not found"*) exit 1;; esac
              done
            done
          PR23_QML_RUNTIME
          )
          flatpak run --user --nofilesystem=home --nofilesystem=host --command=sh org.mixxx.Mixxx \
            -c "$runtime_script" sh "${required[@]}" > "$receipt_dir/qml-wayland-runtime-gate.txt" 2>&1
          # End AI-generated source-derived QML and Wayland runtime gate.

      - name: "Prepare exact audited codec probes"
        shell: bash
        run: |
          mkdir -p parity-tools parity-evidence
          set -euo pipefail
          cat > parity-tools/runtime-codec-probe.c <<'PR23_CODEC_ABI'
          /* AI-generated runtime codec ABI probe begins. */
          #include <dlfcn.h>
          #include <stdio.h>
          #include <string.h>
          
          typedef struct {
              const char *title, *build_date, *build_time;
              int module_id, version;
              unsigned flags;
              char versionStr[32];
          } FdkInfo;
          
          int main(int argc, char **argv) {
              const char *fdkpath = argc > 1 ? argv[1] : "libfdk-aac.so.2";
              void *fdk = dlopen(fdkpath, RTLD_NOW | RTLD_LOCAL);
              if (!fdk) { fprintf(stderr, "FDK load failure: %s\n", dlerror()); return 1; }
              const char *symbols[] = {"aacEncGetLibInfo", "aacEncOpen", "aacEncClose",
                                      "aacEncEncode", "aacEncInfo", "aacEncoder_SetParam"};
              for (unsigned i = 0; i < sizeof(symbols)/sizeof(symbols[0]); i++) {
                  void *symbol = dlsym(fdk, symbols[i]);
                  printf("FDK_SYMBOL %s %s\n", symbols[i], symbol ? "PASS" : "MISSING");
                  if (!symbol) return 1;
              }
              FdkInfo info[128] = {{0}};
              int (*getInfo)(FdkInfo *) = dlsym(fdk, "aacEncGetLibInfo");
              int status = getInfo(info), sbr = 0;
              printf("FDK_INFO_STATUS %d\n", status);
              if (status) return 1;
              for (unsigned i = 0; i < 128 && info[i].module_id; i++) {
                  printf("FDK_MODULE id=%d title=%s version=%.32s flags=%u\n",
                         info[i].module_id, info[i].title ? info[i].title : "",
                         info[i].versionStr, info[i].flags);
                  if (info[i].module_id == 6) sbr = 1;
              }
              printf("FDK_SBR_ENCODER_MODULE %s\n", sbr ? "PRESENT" : "ABSENT");
              /* Mixxx uses module 6 presence to offer HE modes. No audio is encoded. */
              void *av = NULL;
              char soname[64];
              for (int version = 65; version >= 58 && !av; version--) {
                  snprintf(soname, sizeof(soname), "libavcodec.so.%d", version);
                  av = dlopen(soname, RTLD_NOW | RTLD_LOCAL);
              }
              if (!av) { fprintf(stderr, "AVCODEC load failure: %s\n", dlerror()); return 1; }
              unsigned (*avVersion)(void) = dlsym(av, "avcodec_version");
              const void *(*findDecoder)(const char *) = dlsym(av, "avcodec_find_decoder_by_name");
              if (!avVersion || !findDecoder) return 1;
              unsigned version = avVersion();
              printf("AVCODEC_VERSION %u.%u.%u\n", version >> 16, (version >> 8) & 255, version & 255);
              const char *decoders[] = {"aac", "alac", "mp3", "mp3float", "flac", "opus", "pcm_s16le"};
              int aac = 0, alac = 0, mp3 = 0, flac = 0, opus = 0, pcm = 0;
              for (unsigned i = 0; i < sizeof(decoders)/sizeof(decoders[0]); i++) {
                  int present = findDecoder(decoders[i]) != NULL;
                  printf("AVCODEC_DECODER %s %s\n", decoders[i], present ? "PRESENT" : "ABSENT");
                  if (!strcmp(decoders[i], "aac")) aac = present;
                  if (!strcmp(decoders[i], "alac")) alac = present;
                  if (!strcmp(decoders[i], "mp3") || !strcmp(decoders[i], "mp3float")) mp3 |= present;
                  if (!strcmp(decoders[i], "flac")) flac = present;
                  if (!strcmp(decoders[i], "opus")) opus = present;
                  if (!strcmp(decoders[i], "pcm_s16le")) pcm = present;
              }
              dlclose(av);
              dlclose(fdk);
              int required = aac && alac && mp3 && flac && opus && pcm;
              printf("REQUIRED_DECODER_REGISTRY %s\n", required ? "PASS" : "FAIL");
              return required ? 0 : 1;
          }
          /* End AI-generated runtime codec ABI probe. */
          PR23_CODEC_ABI
          echo '76ae985cbf64d3598bcc6c728e37f9b3264c7f0aed72cdaef5a9985efc937dda  parity-tools/runtime-codec-probe.c' | sha256sum --check
          cat > parity-tools/runtime-encoder-mode-probe.c <<'PR23_ENCODER_MODES'
          /* AI-generated empty-input AAC encoder mode probe begins. */
          #include <dlfcn.h>
          #include <stdio.h>
          #include <string.h>
          
          int main(int argc, char **argv) {
              const char *path = "libfdk-aac.so.2";
              int require_he = 1;
              for (int i = 1; i < argc; ++i) {
                  if (!strcmp(argv[i], "--require-he")) require_he = 1;
                  else if (!strcmp(argv[i], "--report-only")) require_he = 0;
                  else path = argv[i];
              }
              void *provider = dlopen(path, RTLD_NOW | RTLD_LOCAL);
              if (!provider) { fprintf(stderr, "FDK load failure: %s\n", dlerror()); return 1; }
              int (*open_encoder)(void **, unsigned, unsigned) = dlsym(provider, "aacEncOpen");
              int (*close_encoder)(void **) = dlsym(provider, "aacEncClose");
              int (*set_parameter)(void *, int, unsigned) = dlsym(provider, "aacEncoder_SetParam");
              int (*encode)(void *, void *, void *, void *, void *) = dlsym(provider, "aacEncEncode");
              if (!open_encoder || !close_encoder || !set_parameter || !encode) return 1;
              const char *modes[] = {"AAC-LC", "HE-AAC", "HE-AACv2"};
              const unsigned aots[] = {2, 5, 29}, bitrates[] = {128000, 64000, 32000};
              int passed[3] = {0};
              for (int mode = 0; mode < 3; ++mode) {
                  void *encoder = NULL;
                  int opened = open_encoder(&encoder, 0, 2);
                  int parameters_ok = opened == 0 && encoder != NULL;
                  const int parameter_ids[] = {0x0100, 0x0103, 0x0106, 0x0107, 0x0101, 0x0300, 0x0200};
                  const unsigned values[] = {aots[mode], 48000, 2, 1, bitrates[mode], 2, 1};
                  printf("AAC_MODE_OPEN %s status=%d\n", modes[mode], opened);
                  for (unsigned i = 0; i < sizeof(parameter_ids)/sizeof(parameter_ids[0]); ++i) {
                      int status = encoder ? set_parameter(encoder, parameter_ids[i], values[i]) : -1;
                      printf("AAC_MODE_PARAMETER %s id=%#x value=%u status=%d\n",
                              modes[mode], parameter_ids[i], values[i], status);
                      if (status) parameters_ok = 0;
                  }
                  /* NULL descriptors request configuration initialization, supplying no samples. */
                  int initialized = encoder ? encode(encoder, NULL, NULL, NULL, NULL) : -1;
                  int closed = encoder ? close_encoder(&encoder) : -1;
                  passed[mode] = parameters_ok && initialized == 0 && closed == 0;
                  printf("AAC_MODE_INITIALIZATION %s init_status=%d close_status=%d %s\n",
                          modes[mode], initialized, closed, passed[mode] ? "PASS" : "UNSUPPORTED_OR_FAILED");
              }
              printf("FDK_HE_ENCODING_PARITY %s\n", passed[1] && passed[2] ? "PASS" : "GAP");
              printf("PROBE_SCOPE empty-input initialization; no samples supplied or encoded; no Mixxx or device launch\n");
              dlclose(provider);
              if (!passed[0]) return 1;
              return require_he && (!passed[1] || !passed[2]) ? 2 : 0;
          }
          /* End AI-generated empty-input AAC encoder mode probe. */
          PR23_ENCODER_MODES
          echo 'e3780ecced04039d3f93721b88a1118a1a98933937da279d45b0fc6720170cab  parity-tools/runtime-encoder-mode-probe.c' | sha256sum --check
          cat > parity-tools/runtime-fdk-qlibrary-probe.cpp <<'PR23_QLIBRARY'
          /* AI-generated provider lookup probe begins. */
          #include <QLibrary>
          #include <QString>
          #include <QtGlobal>
          #include <dlfcn.h>
          #include <cstdio>
          
