name: Pull request or branch build

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
  push:
    branches:
      - "*"
      - "!main"
      - "![0-9].[0-9]"
  workflow_dispatch:

permissions:
  contents: read #  to fetch code (actions/checkout)
  checks: write #  to create new checks (coverallsapp/github-action)

jobs:
  stop-build:
    if: github.event_name != 'workflow_dispatch'
    name: Check if build should be stopped
    runs-on: ubuntu-slim
    outputs:
      result: ${{ github.event_name == 'push' && steps.stop-build.outputs.result || 'false' }}
    steps:
      - name: Check if there is an open PR for this branch
        id: stop-build
        if: ${{ github.event_name == 'push' }}
        uses: actions/github-script@v9
        env:
          ORGANIZATION: mixxxdj
          REPOSITORY: mixxx
        with:
          script: |
            try {
              const branch = context.ref.replace('refs/heads/', '');
              const { data: pullRequests } = await github.rest.pulls.list({
                owner: process.env.ORGANIZATION,
                repo: process.env.REPOSITORY,
                head: `${context.repo.owner}:${branch}`,
                state: 'open'
              });
              console.log(`There is ${pullRequests.length} PR open upstream for branch '${context.repo.owner}:${branch}'`);
              return pullRequests.length != 0;
            } catch (error) {
              console.log(`Didn't find a PR for branch '${context.repo.owner}:${branch}' on '${process.env.ORGANIZATION}/${process.env.REPOSITORY}'.`);
              return false;
            }

  pre-commit:
    if: github.event_name != 'workflow_dispatch' && needs.stop-build.outputs.result == 'false'
    needs:
      - stop-build
    uses: ./.github/workflows/pre-commit.yml
    with:
      pull_request: ${{ github.event_name == 'pull_request' }}

  checks:
    if: github.event_name != 'workflow_dispatch' && needs.stop-build.outputs.result == 'false'
    needs:
      - stop-build
    uses: ./.github/workflows/checks.yml

  git:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/git.yml

  build:
    if: github.event_name != 'workflow_dispatch' && needs.stop-build.outputs.result == 'false'
    needs:
      - stop-build
    permissions:
      contents: read #  to fetch code (actions/checkout)
      actions: write # to delete outdated caches
    uses: ./.github/workflows/build.yml
    with:
      branch: ${{ github.head_ref || github.ref_name }}
      ref: ${{ github.ref }}

  pr23-arm64-dependency-byte-probe:
    name: PR23 Windows ARM64 dependency byte probe
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            tools/windows_buildenv.bat
            tools/ci/pr23_arm64_dependency_remote_probe.cmake
          sparse-checkout-cone-mode: false

      - name: Set up the same ARM64 CMake used by the failed job
        shell: pwsh
        run: |
          $cmakeUrl = 'https://github.com/Kitware/CMake/releases/download/v3.30.1/cmake-3.30.1-windows-arm64.zip'
          $cmakeZip = Join-Path $env:RUNNER_TEMP 'cmake-arm64.zip'
          $cmakeRoot = Join-Path $env:RUNNER_TEMP 'cmake'
          Invoke-WebRequest -Uri $cmakeUrl -OutFile $cmakeZip -TimeoutSec 300
          Expand-Archive -LiteralPath $cmakeZip -DestinationPath $cmakeRoot -Force
          $cmakePath = Join-Path $cmakeRoot 'cmake-3.30.1-windows-arm64\bin'
          $cmakePath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$cmakePath;$env:Path"
          & (Join-Path $cmakePath 'cmake.exe') --version
          Remove-Item -LiteralPath $cmakeZip -Force

      - name: Resolve the ARM64 release URL and pin from the build setup
        shell: cmd
        run: tools\windows_buildenv.bat setup
        env:
          PLATFORM: arm64
          BUILDENV_RELEASE: "TRUE"
          BUILDENV_BASEPATH: '${{ runner.temp }}\pr23-arm64-deps'

      - name: Download and record the dependency response once
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probeRoot = Join-Path $env:RUNNER_TEMP 'pr23-arm64-deps-probe'
          $resultPath = Join-Path $probeRoot 'diagnostic.json'
          New-Item -ItemType Directory -Path $probeRoot -Force | Out-Null
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'tools/ci/pr23_arm64_dependency_remote_probe.cmake'

          $scriptExitCode = 0
          try {
            & cmake "-DPROBE_DIR=$probeRoot" "-DRESULT_FILE=$resultPath" -P $scriptPath
            $scriptExitCode = $LASTEXITCODE
          } catch {
            $scriptExitCode = 1
          }

          if (Test-Path -LiteralPath $resultPath) {
            $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json -AsHashtable
          } else {
            $result = [ordered]@{
              schema_version = 1
              diagnostic_status = 'cmake_script_failed'
              diagnostic_completed = $false
              source_pin_precondition_ok = $false
            }
          }
          $result['cmake_script_exit_code'] = $scriptExitCode
          $result | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $resultPath -Encoding utf8NoBOM

          if ($scriptExitCode -ne 0 -or -not $result['diagnostic_completed'] -or -not $result['source_pin_precondition_ok']) {
            Write-Error 'The dependency byte diagnostic did not reach its completed state; see diagnostic.json.'
          }

      - name: Upload only the small JSON result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/pr23-arm64-deps-probe/diagnostic.json
          archive: false
          if-no-files-found: error
          retention-days: 1

  # This task is used as a probe for auto merge
  # In the future, it could also be used to perform a status update (e.g once the whole CI is passing + is ready for review, add a specific label such as `need review`)
  ready:
    if: github.event_name != 'workflow_dispatch'
    name: Ready to merge
    needs:
      - pre-commit
      - checks
      - git
      - build
    runs-on: ubuntu-slim
    steps:
      - name: Ready to go
        run: "exit 0"
