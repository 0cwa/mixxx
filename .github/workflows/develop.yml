name: PR78 Windows seek diagnostic (not acceptance)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr78-windows-seek-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.repository == '0cwa/mixxx' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/pr78-qt-offscreen-20261002'
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify diagnostic ancestry and exact checkout
        run: |
          $ErrorActionPreference = 'Stop'
          $base = '8d43f359f306c26e042a2ba934daa6f762d7a204'
          $priorDiagnostic = '927e5eaa9b71b7b9048cae96080ee5a6161e984b'
          $priorTree = '86474e928ed542b42b1e97190df0bf02b57fbd72'
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:GITHUB_SHA) { throw 'Checkout mismatch' }
          $parent = git rev-parse HEAD^
          if ($LASTEXITCODE -ne 0 -or $parent -ne $priorDiagnostic) { throw 'Expected reviewed prior diagnostic commit' }
          $actualPriorTree = git rev-parse "$priorDiagnostic^{tree}"
          if ($LASTEXITCODE -ne 0 -or $actualPriorTree -ne $priorTree) { throw 'Prior diagnostic tree mismatch' }
          $priorParent = git rev-parse HEAD^^
          if ($LASTEXITCODE -ne 0 -or $priorParent -ne $base) { throw 'Expected exactly two diagnostic commits atop PR78' }
          $allowed = @('.github/workflows/develop.yml', 'src/test/soundproxy_test.cpp', 'src/sources/soundsourcemediafoundation.cpp')
          $changed = @(git diff --name-only $base HEAD)
          if ($LASTEXITCODE -ne 0 -or @(Compare-Object $allowed $changed).Count -ne 0) { throw 'Unexpected diagnostic paths' }
          $fixture = 'src/test/id3-test-data/cover-test-øé~ł€˚-itunes-12.7.0-alac.m4a'
          if ((git hash-object $fixture) -ne '781512080d633ad5866214df92a8bdd0c22fa47b') { throw 'Fixture changed' }
          Write-Output "DIAG checkout=$actual base=$base event=$env:GITHUB_EVENT_NAME ref=$env:GITHUB_REF"
          git diff --stat $base HEAD
          New-Item -ItemType Directory -Force $env:TMPDIR | Out-Null

      - name: Set up CMake (same version family as failing job)
        uses: jwlawson/actions-setup-cmake@v2.2
        with:
          cmake-version: "3.30.x"

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up unchanged Windows dependency environment
        shell: cmd
        run: tools\windows_buildenv.bat setup
        env:
          BUILDENV_BASEPATH: C:\buildenv
          BUILDENV_RELEASE: TRUE

      - name: Configure with PR78 Windows flags
        run: |
          New-Item -ItemType Directory build | Out-Null
          cmake -S . -B build -DBULK=ON -DHSS1394=ON -DLOCALECOMPARE=ON -DMAD=ON -DMEDIAFOUNDATION=ON -DMODPLUG=ON -DQT6=ON -DQML=ON -DWAVPACK=ON -DVCPKG_TARGET_TRIPLET=x64-windows-release -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH="" -DWARNINGS_FATAL=ON -DDEBUG_ASSERTIONS_FATAL=OFF -DBATTERY=ON -DBROADCAST=ON -DDOWNLOAD_MANUAL=ON -DHID=ON -DKEYFINDER=ON -DLILV=ON -DOPUS=ON -DQTKEYCHAIN=ON -DVINYLCONTROL=ON -DCMAKE_VERBOSE_MAKEFILE=OFF -L
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          CC: cl
          CXX: cl

      - name: Build test target only (no packaging)
        run: cmake --build build --config RelWithDebInfo --target mixxx-test
        env:
          CC: cl
          CXX: cl

      - name: Stage the configured Qt offscreen platform plugin
        run: |
          # CMakeLists installs Qt6::QOffscreenIntegrationPlugin to platforms
          # as part of the applocal component on Windows. Stage only that
          # configured runtime component for CTest's PRE_TEST discovery.
          $stage = Join-Path $env:GITHUB_WORKSPACE 'build\qt-offscreen-stage'
          cmake --install build --config RelWithDebInfo --component applocal --prefix $stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $platformPath = Join-Path $stage 'platforms'
          $plugin = Join-Path $platformPath 'qoffscreen.dll'
          if (-not (Test-Path -LiteralPath $plugin -PathType Leaf)) { throw "CMake applocal install did not stage $plugin" }
          "QT_QPA_PLATFORM=offscreen" >> $env:GITHUB_ENV
          "QT_QPA_PLATFORM_PLUGIN_PATH=$platformPath" >> $env:GITHUB_ENV
          Get-FileHash -Algorithm SHA256 $plugin
          Write-Output "Qt offscreen platform plugin: $plugin"

      - name: Discover exactly one diagnostic test
        working-directory: build
        run: |
          $listing = ctest --show-only=json-v1 -R '^SoundSourceProxyTest.seekForwardBackward$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $inventory = ($listing -join "`n") | ConvertFrom-Json
          if (@($inventory.tests).Count -ne 1 -or $inventory.tests[0].name -ne 'SoundSourceProxyTest.seekForwardBackward') { throw 'Wrong test selection' }
          $exe = $inventory.tests[0].command[0]
          Get-FileHash -Algorithm SHA256 $exe
          Write-Output ($inventory.tests[0] | ConvertTo-Json -Depth 8)

      - name: Diagnostic only — one test, 120-second observation budget
        working-directory: build
        timeout-minutes: 3
        env:
          MIXXX_MF_DIAGNOSTIC: "1"
          CTEST_PARALLEL_LEVEL: 1
          CTEST_OUTPUT_ON_FAILURE: 1
          GTEST_COLOR: 0
        run: |
          # Not acceptance: original build.yml retains its 45-second timeout.
          # -V streams flushed progress even if the process is killed.
          ctest -V --timeout 120 -R '^SoundSourceProxyTest.seekForwardBackward$'
          exit $LASTEXITCODE

      - name: Print diagnostic tail only
        if: always()
        run: |
          if (Test-Path build/Testing/Temporary/LastTest.log) {
            Get-Content build/Testing/Temporary/LastTest.log -Tail 100
          }
