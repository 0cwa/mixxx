# Bounded origin trace for one retained PR47 Windows ARM64 failure.
# Manual dispatch only; this workflow has no matrix or full-suite fallback.
name: PR47 Windows ARM64 failure-origin case

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr47-arm64-one-case:
    name: Windows 11 VS2026 ARM64 / one SoundSourceProxy test
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 90
    steps:
      - name: Check out the selected diagnostic commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Prove the exact diagnostic source before setup
        shell: pwsh
        run: |
          $outDir = 'tmp/pr47-arm64-origin-diagnostic'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $head = (git rev-parse HEAD).Trim()
          $eventSha = $env:GITHUB_SHA
          $commitParts = ((git rev-list --parents -n 1 HEAD).Trim()) -split '\s+'
          $parent = if ($commitParts.Count -ge 2) { $commitParts[1] } else { '' }
          $singleParent = $commitParts.Count -eq 2
          $repairCommit = $parent
          $repairParent = ''
          $repairSingleParent = $false
          $repairTestBlob = ''
          $repairWorkflowBlob = ''
          $repairPaths = @()
          $diagnosticCommit = ''
          $diagnosticParent = ''
          $diagnosticSingleParent = $false
          $diagnosticTestBlob = ''
          $diagnosticWorkflowBlob = ''
          $diagnosticPaths = @()
          $originCommit = ''
          $originParent = ''
          $originSingleParent = $false
          $originTestBlob = ''
          $originWorkflowBlob = ''
          $originPaths = @()
          if ($singleParent -and $repairCommit -eq 'c01ce77a9a77d52e0ae48e7e773a94f3e0c91a73') {
            $repairParts = ((git rev-list --parents -n 1 $repairCommit).Trim()) -split '\s+'
            $repairParent = if ($repairParts.Count -ge 2) { $repairParts[1] } else { '' }
            $repairSingleParent = $repairParts.Count -eq 2
            $repairTestBlob = (git rev-parse ('{0}:src/test/soundproxy_test.cpp' -f $repairCommit)).Trim()
            $repairWorkflowBlob = (git rev-parse ('{0}:.github/workflows/develop.yml' -f $repairCommit)).Trim()
            $repairPaths = @(git diff-tree --no-commit-id --name-only -r $repairCommit | Sort-Object)
            $diagnosticCommit = $repairParent
            if ($repairSingleParent -and $diagnosticCommit -eq 'f35f0c642c2678fe49fb356da91f93ac83269e83') {
              $diagnosticParts = ((git rev-list --parents -n 1 $diagnosticCommit).Trim()) -split '\s+'
              $diagnosticParent = if ($diagnosticParts.Count -ge 2) { $diagnosticParts[1] } else { '' }
              $diagnosticSingleParent = $diagnosticParts.Count -eq 2
              $diagnosticTestBlob = (git rev-parse ('{0}:src/test/soundproxy_test.cpp' -f $diagnosticCommit)).Trim()
              $diagnosticWorkflowBlob = (git rev-parse ('{0}:.github/workflows/develop.yml' -f $diagnosticCommit)).Trim()
              $diagnosticPaths = @(git diff-tree --no-commit-id --name-only -r $diagnosticCommit | Sort-Object)
              $originCommit = $diagnosticParent
              if ($diagnosticSingleParent -and $originCommit -eq '9c7fc31d3aa10bb266977c1f837d3b7e0d3864c8') {
                $originParts = ((git rev-list --parents -n 1 $originCommit).Trim()) -split '\s+'
                $originParent = if ($originParts.Count -ge 2) { $originParts[1] } else { '' }
                $originSingleParent = $originParts.Count -eq 2
                $originTestBlob = (git rev-parse ('{0}:src/test/soundproxy_test.cpp' -f $originCommit)).Trim()
                $originWorkflowBlob = (git rev-parse ('{0}:.github/workflows/develop.yml' -f $originCommit)).Trim()
                $originPaths = @(git diff-tree --no-commit-id --name-only -r $originCommit | Sort-Object)
              }
            }
          }
          $sourceBlob = (git rev-parse 'HEAD:src/test/soundproxy_test.cpp').Trim()
          $workflowBlob = (git rev-parse 'HEAD:.github/workflows/develop.yml').Trim()
          $actualPaths = @(git diff-tree --no-commit-id --name-only -r HEAD | Sort-Object)
          $expectedPaths = @('.github/workflows/develop.yml') | Sort-Object
          $expectedRepairPaths = @('.github/workflows/develop.yml') | Sort-Object
          $expectedDiagnosticPaths = @('.github/workflows/develop.yml') | Sort-Object
          $expectedOriginPaths = @(
            '.github/workflows/develop.yml'
            'src/test/soundproxy_test.cpp'
          ) | Sort-Object
          $pathsMatch = [string]::Join('|', $actualPaths) -ceq [string]::Join('|', $expectedPaths)
          $repairPathsMatch = [string]::Join('|', $repairPaths) -ceq [string]::Join('|', $expectedRepairPaths)
          $diagnosticPathsMatch = [string]::Join('|', $diagnosticPaths) -ceq [string]::Join('|', $expectedDiagnosticPaths)
          $originPathsMatch = [string]::Join('|', $originPaths) -ceq [string]::Join('|', $expectedOriginPaths)
          $status = @(git status --porcelain --untracked-files=all)
          $unexpectedStatus = @($status | Where-Object { $_ -notmatch '^\?\? tmp/pr47-arm64-origin-diagnostic/' })
          $valid = (
            $head -eq $eventSha -and
            $singleParent -and
            $repairCommit -eq 'c01ce77a9a77d52e0ae48e7e773a94f3e0c91a73' -and
            $repairSingleParent -and
            $repairParent -eq 'f35f0c642c2678fe49fb356da91f93ac83269e83' -and
            $repairTestBlob -eq 'f4a5a5a6e29652434db5062c3d7b1f902bb4e997' -and
            $repairWorkflowBlob -eq 'a7fe601bb2e910c73657ffc7f2373e33592bdde3' -and
            $repairPathsMatch -and
            $diagnosticCommit -eq 'f35f0c642c2678fe49fb356da91f93ac83269e83' -and
            $diagnosticSingleParent -and
            $diagnosticParent -eq '9c7fc31d3aa10bb266977c1f837d3b7e0d3864c8' -and
            $diagnosticTestBlob -eq 'f4a5a5a6e29652434db5062c3d7b1f902bb4e997' -and
            $diagnosticWorkflowBlob -eq '5c589e4e71f052c7e559fb3b8bb0a64801357faa' -and
            $diagnosticPathsMatch -and
            $originCommit -eq '9c7fc31d3aa10bb266977c1f837d3b7e0d3864c8' -and
            $originSingleParent -and
            $originParent -eq 'b7006f303e274287cdbf14a4c17d8f2e38245ca1' -and
            $originTestBlob -eq 'f4a5a5a6e29652434db5062c3d7b1f902bb4e997' -and
            $originWorkflowBlob -eq '949347665e4fb0c5a01ba8973d2a035ba6000674' -and
            $originPathsMatch -and
            $sourceBlob -eq 'f4a5a5a6e29652434db5062c3d7b1f902bb4e997' -and
            $workflowBlob -ne '' -and
            $pathsMatch -and
            $unexpectedStatus.Count -eq 0 -and
            $env:RUNNER_OS -eq 'Windows' -and
            $env:RUNNER_ARCH -eq 'ARM64'
          )
          $proof = [ordered]@{
            phase = 'before-build'
            valid = $valid
            event_sha = $eventSha
            checked_out_head = $head
            required_parent = 'c01ce77a9a77d52e0ae48e7e773a94f3e0c91a73'
            actual_parent = $parent
            single_parent = $singleParent
            required_repair_commit = 'c01ce77a9a77d52e0ae48e7e773a94f3e0c91a73'
            actual_repair_commit = $repairCommit
            actual_repair_parent = $repairParent
            repair_single_parent = $repairSingleParent
            required_repair_parent = 'f35f0c642c2678fe49fb356da91f93ac83269e83'
            required_repair_test_blob = 'f4a5a5a6e29652434db5062c3d7b1f902bb4e997'
            actual_repair_test_blob = $repairTestBlob
            required_repair_workflow_blob = 'a7fe601bb2e910c73657ffc7f2373e33592bdde3'
            actual_repair_workflow_blob = $repairWorkflowBlob
            expected_repair_commit_paths = $expectedRepairPaths
            actual_repair_commit_paths = $repairPaths
            repair_commit_paths_match = $repairPathsMatch
            required_diagnostic_commit = 'f35f0c642c2678fe49fb356da91f93ac83269e83'
            actual_diagnostic_commit = $diagnosticCommit
            required_diagnostic_parent = '9c7fc31d3aa10bb266977c1f837d3b7e0d3864c8'
            actual_diagnostic_parent = $diagnosticParent
            diagnostic_single_parent = $diagnosticSingleParent
            required_diagnostic_test_blob = 'f4a5a5a6e29652434db5062c3d7b1f902bb4e997'
            actual_diagnostic_test_blob = $diagnosticTestBlob
            required_diagnostic_workflow_blob = '5c589e4e71f052c7e559fb3b8bb0a64801357faa'
            actual_diagnostic_workflow_blob = $diagnosticWorkflowBlob
            expected_diagnostic_commit_paths = $expectedDiagnosticPaths
            actual_diagnostic_commit_paths = $diagnosticPaths
            diagnostic_commit_paths_match = $diagnosticPathsMatch
            required_origin_commit = '9c7fc31d3aa10bb266977c1f837d3b7e0d3864c8'
            actual_origin_commit = $originCommit
            required_origin_parent = 'b7006f303e274287cdbf14a4c17d8f2e38245ca1'
            actual_origin_parent = $originParent
            origin_single_parent = $originSingleParent
            required_origin_test_blob = 'f4a5a5a6e29652434db5062c3d7b1f902bb4e997'
            actual_origin_test_blob = $originTestBlob
            required_origin_workflow_blob = '949347665e4fb0c5a01ba8973d2a035ba6000674'
            actual_origin_workflow_blob = $originWorkflowBlob
            expected_origin_commit_paths = $expectedOriginPaths
            actual_origin_commit_paths = $originPaths
            origin_commit_paths_match = $originPathsMatch
            required_test_blob = 'f4a5a5a6e29652434db5062c3d7b1f902bb4e997'
            actual_test_blob = $sourceBlob
            workflow_blob = $workflowBlob
            expected_commit_paths = $expectedPaths
            actual_commit_paths = $actualPaths
            unexpected_worktree_status = $unexpectedStatus
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
          }
          $proof | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 "$outDir/source-proof-before.json"
          if (-not $valid) {
            throw 'Exact diagnostic ancestry, source, workflow, worktree, or Windows ARM64 proof failed.'
          }

      - name: Set up MSVC ARM64 command environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Install ARM64 CMake
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'cmake-arm64.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'cmake-arm64'
          Invoke-WebRequest -Uri 'https://github.com/Kitware/CMake/releases/download/v3.30.1/cmake-3.30.1-windows-arm64.zip' -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $destination -Force
          $cmakePath = Join-Path $destination 'cmake-3.30.1-windows-arm64/bin'
          $cmakePath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$cmakePath;$env:Path"

      - name: Select the pinned Windows ARM64 dependency package
        shell: cmd
        run: tools\windows_buildenv.bat name
        env:
          BUILDENV_BASEPATH: C:\buildenv
          BUILDENV_RELEASE: TRUE

      - name: Set up the pinned Windows ARM64 dependency package
        shell: cmd
        run: tools\windows_buildenv.bat setup
        env:
          BUILDENV_BASEPATH: C:\buildenv
          BUILDENV_RELEASE: TRUE

      - name: Configure Mixxx with tests enabled
        shell: pwsh
        run: |
          if (-not $env:MIXXX_VCPKG_ROOT -or -not $env:VCPKG_TARGET_TRIPLET) {
            throw 'The pinned Windows dependency setup did not provide its root and target triplet.'
          }
          $cmakePrefixPath = Join-Path $env:MIXXX_VCPKG_ROOT "installed\$env:VCPKG_TARGET_TRIPLET"
          $cmakeArgs = @(
            '-DBULK=ON'
            '-DHSS1394=ON'
            '-DLOCALECOMPARE=ON'
            '-DMAD=ON'
            '-DMEDIAFOUNDATION=ON'
            '-DMODPLUG=ON'
            '-DQT6=ON'
            '-DQML=ON'
            '-DWAVPACK=ON'
            '-DVCPKG_TARGET_TRIPLET=arm64-windows-release'
            '-DVCPKG_DEFAULT_HOST_TRIPLET=arm64-windows-release'
            '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
            "-DCMAKE_PREFIX_PATH=$cmakePrefixPath"
            '-DWARNINGS_FATAL=ON'
            '-DDEBUG_ASSERTIONS_FATAL=OFF'
            '-DBATTERY=ON'
            '-DBROADCAST=ON'
            '-DDOWNLOAD_MANUAL=OFF'
            '-DHID=ON'
            '-DKEYFINDER=ON'
            '-DLILV=ON'
            '-DOPUS=ON'
            '-DQTKEYCHAIN=ON'
            '-DVINYLCONTROL=ON'
            '-DCMAKE_VERBOSE_MAKEFILE=OFF'
            '-DBUILD_TESTING=ON'
            '-DBUILD_BENCH=OFF'
          )
          & cmake -S . -B build @cmakeArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        env:
          CC: cl
          CXX: cl

      - name: Build only the unit-test executable
        shell: pwsh
        run: |
          cmake --build build --config RelWithDebInfo --target mixxx-test --parallel 4
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        env:
          CC: cl
          CXX: cl

      - name: Stage the Qt offscreen plugin for test discovery
        shell: pwsh
        run: |
          $runtimePrefix = Join-Path $env:GITHUB_WORKSPACE 'build/pr47-test-runtime'
          cmake --install build --config RelWithDebInfo --prefix $runtimePrefix --component applocal
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $platformPlugin = Join-Path $runtimePrefix 'platforms/qoffscreen.dll'
          if (-not (Test-Path -LiteralPath $platformPlugin -PathType Leaf)) {
            throw 'The pinned CMake applocal install did not stage Qt QOffscreenIntegrationPlugin.'
          }
          $platformDirectory = Split-Path -Parent $platformPlugin
          "QT_QPA_PLATFORM_PLUGIN_PATH=$platformDirectory" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Select and run exactly the failing GTest case
        shell: pwsh
        run: |
          $outDir = 'tmp/pr47-arm64-origin-diagnostic'
          $expectedTest = 'SoundSourceProxyTest.regressionTestCachingReaderChunkJumpForward'
          $testRegex = '^SoundSourceProxyTest[.]regressionTestCachingReaderChunkJumpForward$'
          $resultPath = Join-Path $outDir 'case-result.json'
          $result = [ordered]@{
            expected_test = $expectedTest
            selection_count = 0
            status = 'not-run'
            started_utc = $null
            completed_utc = $null
            ctest_exit_code = $null
          }

          $selectionOutput = & ctest --test-dir build --show-only=json-v1 -R $testRegex 2>&1
          $selectionExitCode = $LASTEXITCODE
          $selectionText = (@($selectionOutput | ForEach-Object { [string]$_ }) -join [Environment]::NewLine)
          $selectionText | Set-Content -Encoding utf8 (Join-Path $outDir 'test-selection.json')
          if ($selectionExitCode -ne 0) {
            $result.status = 'selection-command-failed'
            $result.ctest_exit_code = $selectionExitCode
            $result.completed_utc = [DateTimeOffset]::UtcNow.ToString('o')
            $result | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 $resultPath
            exit $selectionExitCode
          }

          try {
            $selection = $selectionText | ConvertFrom-Json -ErrorAction Stop
            $selectedTests = @($selection.tests | Where-Object { $_.name -eq $expectedTest })
            $result.selection_count = $selectedTests.Count
          } catch {
            $result.status = 'selection-output-invalid'
            $result.error = $_.Exception.Message
            $result.completed_utc = [DateTimeOffset]::UtcNow.ToString('o')
            $result | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 $resultPath
            throw
          }

          if ($result.selection_count -ne 1 -or @($selection.tests).Count -ne 1) {
            $result.status = 'selection-mismatch'
            $result.completed_utc = [DateTimeOffset]::UtcNow.ToString('o')
            $result | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 $resultPath
            throw 'CTest did not select exactly the pinned GTest case.'
          }

          $result.status = 'running'
          $result.started_utc = [DateTimeOffset]::UtcNow.ToString('o')
          $result | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 $resultPath
          $testOutput = & ctest --test-dir build --timeout 60 --output-on-failure --verbose -R $testRegex 2>&1
          $testExitCode = $LASTEXITCODE
          $testOutput | Tee-Object -FilePath (Join-Path $outDir 'test.log')
          $result.ctest_exit_code = $testExitCode
          $result.completed_utc = [DateTimeOffset]::UtcNow.ToString('o')
          $result.status = if ($testExitCode -eq 0) { 'passed' } else { 'failed' }
          $result | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 $resultPath
          if ($testExitCode -ne 0) {
            exit $testExitCode
          }
        env:
          CTEST_PARALLEL_LEVEL: 1
          CTEST_OUTPUT_ON_FAILURE: 1
          GTEST_COLOR: 0
          QT_QPA_PLATFORM: offscreen

      - name: Collect a small dump if Windows already produced one
        if: always()
        shell: pwsh
        run: |
          $outDir = 'tmp/pr47-arm64-origin-diagnostic'
          $dumpDir = Join-Path $outDir 'dumps'
          New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
          $resultPath = Join-Path $outDir 'case-result.json'
          $startUtc = $null
          if (Test-Path $resultPath) {
            try {
              $result = Get-Content $resultPath -Raw | ConvertFrom-Json
              if ($result.started_utc) {
                $startUtc = [DateTimeOffset]::Parse($result.started_utc).UtcDateTime
              }
            } catch {
              $startUtc = $null
            }
          }
          $crashDir = Join-Path $env:LOCALAPPDATA 'CrashDumps'
          $copied = @()
          $skipped = @()
          if ($startUtc -and (Test-Path $crashDir)) {
            $dumps = Get-ChildItem -Path $crashDir -Filter 'mixxx-test.exe*.dmp' -File -ErrorAction SilentlyContinue |
              Where-Object { $_.LastWriteTimeUtc -ge $startUtc }
            foreach ($dump in $dumps) {
              if ($dump.Length -le 268435456) {
                $destination = Join-Path $dumpDir $dump.Name
                Copy-Item -LiteralPath $dump.FullName -Destination $destination
                $copied += [ordered]@{ name = $dump.Name; bytes = $dump.Length }
              } else {
                $skipped += [ordered]@{ name = $dump.Name; bytes = $dump.Length; reason = 'over-256-MiB-limit' }
              }
            }
          }
          [ordered]@{
            source = $crashDir
            copied_dumps = $copied
            skipped_dumps = $skipped
            configured_os_capture = $false
          } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 (Join-Path $outDir 'dump-inventory.json')

      - name: Prove the exact diagnostic source after execution
        if: always()
        shell: pwsh
        run: |
          $outDir = 'tmp/pr47-arm64-origin-diagnostic'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $head = (git rev-parse HEAD).Trim()
          $eventSha = $env:GITHUB_SHA
          $commitParts = ((git rev-list --parents -n 1 HEAD).Trim()) -split '\s+'
          $parent = if ($commitParts.Count -ge 2) { $commitParts[1] } else { '' }
          $singleParent = $commitParts.Count -eq 2
          $repairCommit = $parent
          $repairParent = ''
          $repairSingleParent = $false
          $repairTestBlob = ''
          $repairWorkflowBlob = ''
          $repairPaths = @()
          $diagnosticCommit = ''
          $diagnosticParent = ''
          $diagnosticSingleParent = $false
          $diagnosticTestBlob = ''
          $diagnosticWorkflowBlob = ''
          $diagnosticPaths = @()
          $originCommit = ''
          $originParent = ''
          $originSingleParent = $false
          $originTestBlob = ''
          $originWorkflowBlob = ''
          $originPaths = @()
          if ($singleParent -and $repairCommit -eq 'c01ce77a9a77d52e0ae48e7e773a94f3e0c91a73') {
            $repairParts = ((git rev-list --parents -n 1 $repairCommit).Trim()) -split '\s+'
            $repairParent = if ($repairParts.Count -ge 2) { $repairParts[1] } else { '' }
            $repairSingleParent = $repairParts.Count -eq 2
            $repairTestBlob = (git rev-parse ('{0}:src/test/soundproxy_test.cpp' -f $repairCommit)).Trim()
            $repairWorkflowBlob = (git rev-parse ('{0}:.github/workflows/develop.yml' -f $repairCommit)).Trim()
            $repairPaths = @(git diff-tree --no-commit-id --name-only -r $repairCommit | Sort-Object)
            $diagnosticCommit = $repairParent
            if ($repairSingleParent -and $diagnosticCommit -eq 'f35f0c642c2678fe49fb356da91f93ac83269e83') {
              $diagnosticParts = ((git rev-list --parents -n 1 $diagnosticCommit).Trim()) -split '\s+'
              $diagnosticParent = if ($diagnosticParts.Count -ge 2) { $diagnosticParts[1] } else { '' }
              $diagnosticSingleParent = $diagnosticParts.Count -eq 2
              $diagnosticTestBlob = (git rev-parse ('{0}:src/test/soundproxy_test.cpp' -f $diagnosticCommit)).Trim()
              $diagnosticWorkflowBlob = (git rev-parse ('{0}:.github/workflows/develop.yml' -f $diagnosticCommit)).Trim()
              $diagnosticPaths = @(git diff-tree --no-commit-id --name-only -r $diagnosticCommit | Sort-Object)
              $originCommit = $diagnosticParent
              if ($diagnosticSingleParent -and $originCommit -eq '9c7fc31d3aa10bb266977c1f837d3b7e0d3864c8') {
                $originParts = ((git rev-list --parents -n 1 $originCommit).Trim()) -split '\s+'
                $originParent = if ($originParts.Count -ge 2) { $originParts[1] } else { '' }
                $originSingleParent = $originParts.Count -eq 2
                $originTestBlob = (git rev-parse ('{0}:src/test/soundproxy_test.cpp' -f $originCommit)).Trim()
                $originWorkflowBlob = (git rev-parse ('{0}:.github/workflows/develop.yml' -f $originCommit)).Trim()
                $originPaths = @(git diff-tree --no-commit-id --name-only -r $originCommit | Sort-Object)
              }
            }
          }
          $sourceBlob = (git rev-parse 'HEAD:src/test/soundproxy_test.cpp').Trim()
          $workflowBlob = (git rev-parse 'HEAD:.github/workflows/develop.yml').Trim()
          $actualPaths = @(git diff-tree --no-commit-id --name-only -r HEAD | Sort-Object)
          $expectedPaths = @('.github/workflows/develop.yml') | Sort-Object
          $expectedRepairPaths = @('.github/workflows/develop.yml') | Sort-Object
          $expectedDiagnosticPaths = @('.github/workflows/develop.yml') | Sort-Object
          $expectedOriginPaths = @(
            '.github/workflows/develop.yml'
            'src/test/soundproxy_test.cpp'
          ) | Sort-Object
          $pathsMatch = [string]::Join('|', $actualPaths) -ceq [string]::Join('|', $expectedPaths)
          $repairPathsMatch = [string]::Join('|', $repairPaths) -ceq [string]::Join('|', $expectedRepairPaths)
          $diagnosticPathsMatch = [string]::Join('|', $diagnosticPaths) -ceq [string]::Join('|', $expectedDiagnosticPaths)
          $originPathsMatch = [string]::Join('|', $originPaths) -ceq [string]::Join('|', $expectedOriginPaths)
          $status = @(git status --porcelain --untracked-files=all)
          $unexpectedStatus = @($status | Where-Object { $_ -notmatch '^\?\? tmp/pr47-arm64-origin-diagnostic/' })
          $valid = (
            $head -eq $eventSha -and
            $singleParent -and
            $repairCommit -eq 'c01ce77a9a77d52e0ae48e7e773a94f3e0c91a73' -and
            $repairSingleParent -and
            $repairParent -eq 'f35f0c642c2678fe49fb356da91f93ac83269e83' -and
            $repairTestBlob -eq 'f4a5a5a6e29652434db5062c3d7b1f902bb4e997' -and
            $repairWorkflowBlob -eq 'a7fe601bb2e910c73657ffc7f2373e33592bdde3' -and
            $repairPathsMatch -and
            $diagnosticCommit -eq 'f35f0c642c2678fe49fb356da91f93ac83269e83' -and
            $diagnosticSingleParent -and
            $diagnosticParent -eq '9c7fc31d3aa10bb266977c1f837d3b7e0d3864c8' -and
