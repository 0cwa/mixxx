              set -eu
              c++ -std=c++17 -fPIC -Wall -Wextra "$1" $(pkg-config --cflags --libs Qt6Core) -ldl -o "$2"
            ' sh "$PWD/parity-tools/runtime-fdk-qlibrary-probe.cpp" \
            "$PWD/parity-evidence/runtime-fdk-qlibrary-probe" \
            2>&1 | tee parity-evidence/runtime-fdk-qlibrary-probe-compile.txt
          sha256sum parity-evidence/runtime-codec-probe parity-evidence/runtime-encoder-mode-probe \
            parity-evidence/runtime-fdk-qlibrary-probe > parity-evidence/probe-binary-sha256.txt

      - name: "Install exact application and Platform in the task workspace"
        id: install-runtime
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$PWD/.pr23-parity-data"
          export FLATPAK_USER_DIR="$PWD/.pr23-parity-data/flatpak"
