          done
          if test "$external_rc" = 0; then
            grep -Eq "^AVCODEC_VERSION ${SOURCE_AVCODEC_MAJOR}\." \
              parity-evidence/external-fdk-provider-abi.txt
          fi
          exit "$external_rc"

      - name: "Preserve runtime parity evidence"
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pr23-runtime-codec-parity-x86_64
          path: parity-evidence/
          if-no-files-found: error

