            > "$receipt_dir/external-fdk-provider-abi.txt" 2>&1
          "${runtime[@]}" --command="$probe_dir/runtime-encoder-mode-probe" org.mixxx.Mixxx \
            > "$receipt_dir/external-fdk-encoding-modes.txt" 2>&1
          flatpak --user info --show-commit org.mixxx.Mixxx > "$receipt_dir/external-profile-app-commit-after.txt"
          cmp "$receipt_dir/external-profile-app-commit-before.txt" "$receipt_dir/external-profile-app-commit-after.txt"
          printf '%s\n' 'External full-provider profile passed; canonical shipped-default profile results remain separate.' \
            > "$receipt_dir/external-profile-scope.txt"
          # End AI-generated optional external-provider CI prototype.
          PR23_EXTERNAL_FDK
          echo '4bdf4b7f30a8aa268df72a1b23261551af009274ca92add476f8d8914386d06e  parity-tools/prototype-external-fdk-profile.sh' | sha256sum --check
          sha256sum parity-tools/* > parity-evidence/helper-source-sha256.txt

      - name: "Compile only three small probes inside the KDE SDK"
        shell: bash
        run: |
          set -euo pipefail
          flatpak info --show-commit org.kde.Sdk/x86_64/6.10 > parity-evidence/compiler-sdk-commit.txt
          flatpak info --show-metadata org.kde.Sdk/x86_64/6.10 > parity-evidence/compiler-sdk-metadata.txt
          for probe in runtime-codec-probe runtime-encoder-mode-probe; do
