          "${runtime[@]}" --command=sh org.mixxx.Mixxx -c 'ldd "$1"' sh \
            "$provider_dir/libfdk-aac.so.2" > "$receipt_dir/external-fdk-runtime-ldd.txt" 2>&1
          if grep -q 'not found' "$receipt_dir/external-fdk-runtime-ldd.txt"; then exit 1; fi
          "${runtime[@]}" --command="$probe_dir/runtime-fdk-qlibrary-probe" org.mixxx.Mixxx \
