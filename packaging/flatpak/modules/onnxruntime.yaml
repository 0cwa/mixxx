name: onnxruntime
buildsystem: simple
only-arches:
  - x86_64
  - aarch64
# The upstream CPU archives are already shared-library builds with the C/C++
# API and no GPU execution providers. Using them keeps this module free of
# ONNX Runtime's network-fetched build dependencies and test artifacts.
build-commands:
  - install -d "${FLATPAK_DEST}/include/onnxruntime" "${FLATPAK_DEST}/lib" "${FLATPAK_DEST}/lib/cmake/onnxruntime" "${FLATPAK_DEST}/lib/cmake/ONNXRuntime"
  - cp -a include/. "${FLATPAK_DEST}/include/onnxruntime/"
  - cp -a lib/libonnxruntime.so* lib/libonnxruntime_providers_shared.so "${FLATPAK_DEST}/lib/"
  - cp -a lib/cmake/onnxruntime/. "${FLATPAK_DEST}/lib/cmake/onnxruntime/"
  # The release archives ship libraries in lib/, but their generated target
  # file retains the build-time lib64/ install path.
  - sed 's#/lib64/#/lib/#g' lib/cmake/onnxruntime/onnxruntimeTargets-release.cmake > "${FLATPAK_DEST}/lib/cmake/onnxruntime/onnxruntimeTargets-release.cmake"
  - cp -a "${FLATPAK_DEST}/lib/cmake/onnxruntime/." "${FLATPAK_DEST}/lib/cmake/ONNXRuntime/"
  - install -Dm644 "${FLATPAK_DEST}/lib/cmake/onnxruntime/onnxruntimeConfig.cmake" "${FLATPAK_DEST}/lib/cmake/ONNXRuntime/ONNXRuntimeConfig.cmake"
  - install -Dm644 "${FLATPAK_DEST}/lib/cmake/onnxruntime/onnxruntimeConfigVersion.cmake" "${FLATPAK_DEST}/lib/cmake/ONNXRuntime/ONNXRuntimeConfigVersion.cmake"
  - install -Dm644 LICENSE "${FLATPAK_DEST}/share/licenses/onnxruntime/LICENSE"
  - install -Dm644 ThirdPartyNotices.txt "${FLATPAK_DEST}/share/licenses/onnxruntime/ThirdPartyNotices.txt"
  - install -Dm644 Privacy.md "${FLATPAK_DEST}/share/licenses/onnxruntime/Privacy.md"
sources:
  - type: archive
    url: https://github.com/microsoft/onnxruntime/releases/download/v1.26.0/onnxruntime-linux-x64-1.26.0.tgz
    sha256: 1254da24fb389cf39dc0ff3451ab48301740ffbfcbaf646849df92f80ee92c57
    only-arches:
      - x86_64
    strip-components: 1
  - type: archive
    url: https://github.com/microsoft/onnxruntime/releases/download/v1.26.0/onnxruntime-linux-aarch64-1.26.0.tgz
    sha256: 34ff1c2d0f12e2cf3d33a0c5f82e39792e1d581fbd6968fd7c30d173654be01a
    only-arches:
      - aarch64
    strip-components: 1
