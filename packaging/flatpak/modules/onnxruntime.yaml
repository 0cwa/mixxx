name: onnxruntime
buildsystem: simple
only-arches:
  - x86_64
  - aarch64
# These upstream CPU archives contain the C/C++ API and shared library. They
# avoid a network-fetched ONNX Runtime source build and its test artifacts.
build-commands:
  - install -d "${FLATPAK_DEST}/include" "${FLATPAK_DEST}/lib" "${FLATPAK_DEST}/lib/cmake/onnxruntime" "${FLATPAK_DEST}/lib/cmake/ONNXRuntime"
  # The release archive contains flat headers directly in include/. Fail early
  # if the header consumed by Mixxx is missing before copying that layout.
  - test -f include/onnxruntime_cxx_api.h
  - test -f lib/libonnxruntime_providers_shared.so
  - test -L lib/libonnxruntime.so
  - test "$(readlink lib/libonnxruntime.so)" = libonnxruntime.so.1
  - test -L lib/libonnxruntime.so.1
  - test "$(readlink lib/libonnxruntime.so.1)" = libonnxruntime.so.1.26.0
  - test -f lib/libonnxruntime.so.1.26.0
  - test -f lib/cmake/onnxruntime/onnxruntimeConfig.cmake
  - test -f lib/cmake/onnxruntime/onnxruntimeConfigVersion.cmake
  - test -f lib/cmake/onnxruntime/onnxruntimeTargets.cmake
  - test -f lib/cmake/onnxruntime/onnxruntimeTargets-release.cmake
  - cp -a include/. "${FLATPAK_DEST}/include/"
  - cp -a lib/libonnxruntime.so* lib/libonnxruntime_providers_shared.so "${FLATPAK_DEST}/lib/"
  - cp -a lib/cmake/onnxruntime/. "${FLATPAK_DEST}/lib/cmake/onnxruntime/"
  # The archive libraries are in lib/, but the generated target files retain
  # the build-time lib64/ install path and advertise a nested include path.
  # Normalize both paths to the files installed above and do not add a dummy
  # include directory that could hide missing headers.
  - sed 's#/include/onnxruntime#/include#g' lib/cmake/onnxruntime/onnxruntimeTargets.cmake > "${FLATPAK_DEST}/lib/cmake/onnxruntime/onnxruntimeTargets.cmake"
  - sed 's#/lib64/#/lib/#g' lib/cmake/onnxruntime/onnxruntimeTargets-release.cmake > "${FLATPAK_DEST}/lib/cmake/onnxruntime/onnxruntimeTargets-release.cmake"
  - cp -a "${FLATPAK_DEST}/lib/cmake/onnxruntime/." "${FLATPAK_DEST}/lib/cmake/ONNXRuntime/"
  - install -Dm644 "${FLATPAK_DEST}/lib/cmake/onnxruntime/onnxruntimeConfig.cmake" "${FLATPAK_DEST}/lib/cmake/ONNXRuntime/ONNXRuntimeConfig.cmake"
  - install -Dm644 "${FLATPAK_DEST}/lib/cmake/onnxruntime/onnxruntimeConfigVersion.cmake" "${FLATPAK_DEST}/lib/cmake/ONNXRuntime/ONNXRuntimeConfigVersion.cmake"
  - install -Dm644 LICENSE "${FLATPAK_DEST}/share/licenses/onnxruntime/LICENSE"
  - install -Dm644 ThirdPartyNotices.txt "${FLATPAK_DEST}/share/licenses/onnxruntime/ThirdPartyNotices.txt"
  - install -Dm644 Privacy.md "${FLATPAK_DEST}/share/licenses/onnxruntime/Privacy.md"
sources:
  - type: archive
    url: https://github.com/microsoft/onnxruntime/releases/download/v1.26.0/onnxruntime-linux-x64-1.26.0.tgz
    sha256: 1254da24fb389cf39dc0ff3451ab48301740ffbfcbaf646849df92f80ee92c57
    only-arches:
      - x86_64
    strip-components: 1
  - type: archive
    url: https://github.com/microsoft/onnxruntime/releases/download/v1.26.0/onnxruntime-linux-aarch64-1.26.0.tgz
    sha256: 34ff1c2d0f12e2cf3d33a0c5f82e39792e1d581fbd6968fd7c30d173654be01a
    only-arches:
      - aarch64
    strip-components: 1
