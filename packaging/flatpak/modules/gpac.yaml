name: gpac
buildsystem: simple
build-commands:
  - ./configure --prefix=${FLATPAK_DEST}
  - make -j${FLATPAK_BUILDER_N_JOBS}
  - make install
  - install -Dm644 COPYING ${FLATPAK_DEST}/share/licenses/gpac/COPYING
